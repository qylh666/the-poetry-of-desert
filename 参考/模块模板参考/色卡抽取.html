<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色卡抽取</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1116;
            --surface: #181b21;
            --surface-hover: #1e222a;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(201,169,106,0.08) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(107,74,122,0.1) 0%, transparent 45%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 18px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold-bright); text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 9px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.4);
            border-radius: var(--radius);
            color: var(--gold);
            font-family: var(--font-body);
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn:hover { background: var(--surface-hover); border-color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,169,106,0.15); }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-mid), var(--gold));
            border-color: var(--gold-bright);
            color: #1a1512;
            font-weight: 700;
        }
        .btn-primary:hover { box-shadow: 0 0 25px rgba(201,169,106,0.4); }
        .btn.active { background: rgba(201,169,106,0.15); border-color: var(--gold); color: var(--gold-bright); }
        .count-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .color-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }
        .color-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 12px rgba(201,169,106,0.2);
        }
        .color-block {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .color-info {
            padding: 8px 10px;
        }
        .color-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .color-hex {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-faint);
            letter-spacing: 0.05em;
        }
        .empty-hint {
            text-align: center;
            color: var(--text-faint);
            font-size: 12px;
            padding: 30px 0;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>色卡抽取</h1>
        <div class="sub">Color Card Draw</div>
    </div>

    <div class="controls">
        <span class="count-label">抽取数量</span>
        <button class="btn" data-count="1" onclick="setCount(1)">1</button>
        <button class="btn" data-count="3" onclick="setCount(3)">3</button>
        <button class="btn active" data-count="5" onclick="setCount(5)">5</button>
        <button class="btn" data-count="10" onclick="setCount(10)">10</button>
        <button class="btn btn-primary" onclick="drawColors()">抽取</button>
        <button class="btn" onclick="copyAll()">复制全部色号</button>
    </div>

    <div class="card-grid" id="cardGrid"></div>
    <div class="empty-hint" id="emptyHint">点击「抽取」开始</div>
</div>

<script>
// ========== 颜色库（十个示例） ==========
const colorData = [
    {name:"古代紫", hex:"#895b8a"},
    {name:"蔚藍", hex:"#70f3ff"},
    {name:"寶藍", hex:"#4b5cc4"},
    {name:"黛綠", hex:"#426666"},
    {name:"硃砂", hex:"#ff461f"},
    {name:"桃紅", hex:"#f47983"},
    {name:"松花色", hex:"#bce672"},
    {name:"青碧", hex:"#48c0a3"},
    {name:"金色", hex:"#eacd76"},
    {name:"月白", hex:"#d6ecf0"}
];

let drawCount = 5;
let currentCards = [];

function setCount(n) {
    drawCount = n;
    document.querySelectorAll('[data-count]').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.count) === n);
    });
}

function drawColors() {
    const grid = document.getElementById('cardGrid');
    const emptyHint = document.getElementById('emptyHint');

    const shuffled = [...colorData].sort(() => Math.random() - 0.5);
    currentCards = shuffled.slice(0, Math.min(drawCount, shuffled.length));

    grid.innerHTML = currentCards.map(c => {
        const textColor = getContrastColor(c.hex);
        return `
            <div class="color-card" onclick="copyHex('${c.hex}')" title="点击复制色号">
                <div class="color-block" style="background:${c.hex};color:${textColor};">${c.hex}</div>
                <div class="color-info">
                    <div class="color-name">${c.name}</div>
                    <div class="color-hex">${c.hex}</div>
                </div>
            </div>`;
    }).join('');

    emptyHint.style.display = 'none';
}

function getContrastColor(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
    return brightness > 160 ? '#1a1512' : '#ffffff';
}

function copyHex(hex) {
    copyToClipboard(hex);
}

function copyAll() {
    if (currentCards.length === 0) return;
    const text = currentCards.map(c => `${c.name} ${c.hex}`).join('\n');
    copyToClipboard(text);
}

function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
}

// 初始默认抽取一次
drawColors();
</script>
</body>
</html>
