<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>术语库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1116;
            --surface: #181b21;
            --surface-hover: #1e222a;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --red: #9e3b34;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 20% 110%, rgba(201,169,106,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(201,169,106,0.05) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px),
                repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(201,169,106,0.01) 27px, rgba(201,169,106,0.01) 28px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 22px; position: relative; padding-bottom: 16px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 11px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        /* ========== 双栏布局 ========== */
        .glossary-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 860px) {
            .glossary-layout { grid-template-columns: 1fr; }
        }

        /* 通用卡片 */
        .card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 14px 16px;
        }

        /* ========== 左侧分类树 ========== */
        .category-card {
            position: sticky;
            top: 16px;
        }
        .category-card .card-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 0.06em;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201,169,106,0.2);
        }
        .category-list { list-style: none; padding: 0; }
        .category-item { margin: 1px 0; }
        .category-item .cat-node {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: var(--radius);
            transition: var(--transition);
            font-size: 13px;
            color: var(--text-secondary);
            position: relative;
        }
        .category-item .cat-node:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }
        .category-item .cat-node.active {
            background: rgba(201,169,106,0.1);
            color: var(--gold-bright);
            border-left: 2px solid var(--gold);
            padding-left: 8px;
        }
        .category-item .cat-node .cat-name { flex: 1; letter-spacing: 0.04em; }
        .category-item .cat-node .cat-count {
            font-size: 10px;
            color: var(--text-faint);
            letter-spacing: 0.05em;
        }
        .category-item .cat-node.active .cat-count { color: var(--gold-mid); }
        .category-item .cat-node .arrow {
            width: 12px;
            font-size: 8px;
            color: var(--gold-dim);
            transition: transform 0.25s;
            flex-shrink: 0;
            text-align: center;
        }
        .category-item .cat-node .arrow.open { transform: rotate(90deg); }
        .sub-cat-list { list-style: none; padding-left: 14px; display: none; }
        .sub-cat-list.open { display: block; }
        .sub-cat-list .cat-node { padding-left: 16px; font-size: 12px; }

        /* ========== 右侧词条列表 ========== */
        .term-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .term-header .term-section-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--gold-bright);
            letter-spacing: 0.06em;
        }
        .term-header .term-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-input { flex: 1; padding: 9px 14px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; transition: var(--transition); }
        .search-input:focus { border-color: rgba(201,169,106,0.6); box-shadow: 0 0 15px rgba(201,169,106,0.1); }

        .btn { padding: 8px 14px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: var(--radius); color: var(--gold); font-family: var(--font-body); font-size: 12px; cursor: pointer; letter-spacing: 0.06em; transition: var(--transition); white-space: nowrap; }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); box-shadow: 0 0 15px rgba(201,169,106,0.15); }
        .btn-primary { background: rgba(201,169,106,0.12); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }
        .btn-danger { border-color: rgba(158,59,52,0.6); color: #c46b63; }
        .btn-danger:hover { background: rgba(158,59,52,0.1); box-shadow: 0 0 15px rgba(158,59,52,0.2); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        .term-list { display: flex; flex-direction: column; gap: 10px; }
        .term-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 12px 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        .term-card:hover { background: var(--surface-hover); border-color: rgba(201,169,106,0.5); }
        .term-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .term-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.03em; }
        .term-ref { font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; margin-left: auto; }
        .term-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; margin-top: 6px; font-weight: 300; }
        .term-body { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(201,169,106,0.15); }
        .term-card.open .term-body { display: block; }
        .expand-hint { font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; margin-top: 6px; }
        .term-card.open .expand-hint { display: none; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
        .tbl th { font-family: var(--font-display); font-size: 11px; color: var(--gold); text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(201,169,106,0.3); letter-spacing: 0.08em; }
        .tbl td { padding: 6px 8px; border-bottom: 1px solid rgba(201,169,106,0.1); color: var(--text-secondary); }
        .tbl tr:last-child td { border-bottom: none; }

        .pager { display: flex; align-items: center; gap: 10px; margin-top: 14px; justify-content: flex-end; font-size: 11px; color: var(--text-faint); }

        /* 删除栏 */
        .delbar { display: none; position: sticky; bottom: 16px; background: rgba(18,16,13,0.95); border: 1px solid rgba(158,59,52,0.6); border-radius: var(--radius); padding: 10px 16px; justify-content: space-between; align-items: center; gap: 12px; z-index: 20; backdrop-filter: blur(10px); margin-top: 12px; }
        .delbar .cnt { font-size: 13px; color: var(--text-primary); }
        .delbar .cnt b { color: #c46b63; }
        .sel { width: 16px; height: 16px; cursor: pointer; margin-right: 8px; }

        /* 编辑弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 20px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px; padding: 20px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-head { margin-bottom: 14px; }
        .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal label { display: block; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 10px; transition: var(--transition); }
        .modal input:focus, .modal textarea:focus { border-color: rgba(201,169,106,0.6); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
        .tip { font-size: 11px; color: var(--text-faint); text-align: center; margin-top: 8px; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>术语库</h1>
        <div class="sub">世界观辞典 · 分类导航</div>
    </div>

    <div class="glossary-layout">
        <!-- 左侧分类树 -->
        <div class="card category-card">
            <div class="card-title">分类</div>
            <ul class="category-list" id="categoryList"></ul>
        </div>

        <!-- 右侧词条列表 -->
        <div>
            <div class="card">
                <div class="term-header">
                    <div class="term-section-title" id="sectionTitle">全部分类</div>
                    <div class="term-actions">
                        <button class="btn btn-sm" onclick="addTerm()">＋ 新增术语</button>
                        <button class="btn btn-danger btn-sm" onclick="toggleDelMode()" id="btnDel">删除</button>
                    </div>
                </div>
                <div class="search-row">
                    <input id="q" class="search-input" placeholder="搜索术语或解释…" oninput="page=0;renderTerms();">
                    <button class="btn btn-sm" onclick="clearSearch()">清除</button>
                </div>
            </div>

            <div class="term-list" id="terms"></div>
            <div class="pager" id="pager"></div>

            <div class="delbar" id="delbar">
                <span class="cnt">已选 <b id="delCnt">0</b> 项</span>
                <button class="btn btn-primary btn-sm" onclick="deleteSelected()">确认删除</button>
                <button class="btn btn-sm" onclick="toggleDelMode()">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editorWrap" onclick="if(event.target===this)closeEditor()">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title" id="editorTitle"></div>
            <button class="modal-close" onclick="closeEditor()">✕</button>
        </div>
        <div id="editorFields"></div>
        <div class="modal-btns">
            <button class="btn btn-sm" onclick="closeEditor()">取消</button>
            <button class="btn btn-primary btn-sm" id="editorSave">保存</button>
        </div>
        <div class="tip" id="editorTip"></div>
    </div>
</div>

<script>
// ========== 占位数据 ==========
let terms = [
    { term: '空流', cat: '魔法', ref: 'MAG-01', desc: '弥漫于尤克特拉大陆的神秘能量，陨石坠落后苏醒。可被魔法式调用，高纯度空流对生物有害。', table: null },
    { term: '魔法式', cat: '魔法', ref: 'MAG-02', desc: '施法者用媒介在空气中书写出来的“空流塑形程序”。必须存在，咒语可省略但魔法式更复杂。', table: null },
    { term: '咒语', cat: '魔法', ref: 'MAG-03', desc: '与天地神对话的辅助手段。可以省略，但省略后魔法式更复杂。', table: null },
    { term: '五大元素', cat: '魔法', ref: 'MAG-04', desc: '空流被调用后呈现的五种形态：土、火、水、风、天。', table: {
        tableHead: ['元素', '核心', '说明'],
        table: [
            { c1: '土', c2: '聚合', c3: '形成坚固稳定的结构' },
            { c1: '火', c2: '释放', c3: '剧烈直接地转化为光与热' },
            { c1: '水', c2: '引导', c3: '赋予液体流动与变形' },
            { c1: '风', c2: '传导', c3: '改变传播方向和范围' },
            { c1: '天', c2: '干涉', c3: '作用于魔法式本身' }
        ]
    } },
    { term: '尤克特拉', cat: '地理', ref: 'GEO-01', desc: '故事发生的大陆名称。', table: null },
    { term: '瓦格尔沙漠', cat: '地理', ref: 'GEO-02', desc: '位于尤克特拉西部的广阔沙海，空流浓度较高。', table: null },
    { term: '始源岛', cat: '地理', ref: 'GEO-03', desc: '大陆西南方向的近海岛屿，禁忌之地。', table: null },
    { term: '星陨纪年', cat: '历史', ref: 'HIS-01', desc: '以陨石坠落那一天为星陨元年 1 月 1 日。', table: null },
    { term: '暮色战争', cat: '历史', ref: 'HIS-02', desc: '星陨 1350 年开始，持续百年的大陆战争。', table: null },
    { term: '白雾战争', cat: '历史', ref: 'HIS-03', desc: '星陨 270 年由艾尔亚·利夫兹发起的独立战争。', table: null },
    { term: '魔法师协会', cat: '组织', ref: 'ORG-01', desc: '由会长领导的独立组织，掌握晶体、传送阵、魔法评级等核心体系。', table: null },
    { term: '创世神教', cat: '组织', ref: 'ORG-02', desc: '以信仰创世神洛丽玛丝为核心，势力遍布大陆。', table: null },
    { term: '晶体', cat: '货币', ref: 'ECO-01', desc: '人造魔法产品，大陆通用货币。由银晶和人造金刚石制成。', table: null },
    { term: '金币与银币', cat: '货币', ref: 'ECO-02', desc: '从第一王国时代沿用至今的货币。', table: null }
];

let currentCat = '';
let delMode = false;
let delSel = new Set();
let page = 0;
const PAGE_SIZE = 5;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function cats() {
    const c = [...new Set(terms.map(t => t.cat))];
    return c.sort();
}

function renderCategories() {
    const list = document.getElementById('categoryList');
    const allCount = terms.length;
    let html = `
        <li class="category-item">
            <div class="cat-node ${currentCat === '' ? 'active' : ''}" onclick="setCat('')">
                <span class="cat-name">全部分类</span>
                <span class="cat-count">${allCount}</span>
            </div>
        </li>`;

    cats().forEach(c => {
        const count = terms.filter(t => t.cat === c).length;
        html += `
        <li class="category-item">
            <div class="cat-node ${currentCat === c ? 'active' : ''}" onclick="setCat('${esc(c)}')">
                <span class="cat-name">${esc(c)}</span>
                <span class="cat-count">${count}</span>
            </div>
        </li>`;
    });

    list.innerHTML = html;
}

function setCat(c) {
    currentCat = c;
    page = 0;
    renderCategories();
    renderTerms();
}

function filtered() {
    const q = (document.getElementById('q').value || '').trim().toLowerCase();
    return terms.filter(t => {
        if (currentCat && t.cat !== currentCat) return false;
        if (q && ![t.term, t.desc, t.cat].join(' ').toLowerCase().includes(q)) return false;
        return true;
    });
}

function renderTerms() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page >= pages) page = 0;
    const slice = list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

    document.getElementById('sectionTitle').textContent = currentCat || '全部分类';
    document.getElementById('terms').innerHTML = slice.length ? slice.map(t => {
        const table = t.table ? `
            <table class="tbl">
                <thead><tr>${t.table.tableHead.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
                <tbody>${t.table.table.map(r => `<tr><td><b>${esc(r.c1 || '')}</b></td><td>${esc(r.c2 || '')}</td><td>${esc(r.c3 || '')}</td></tr>`).join('')}</tbody>
            </table>` : '';
        return `
        <div class="term-card" onclick="toggleTerm(this)">
            <div class="term-head">
                ${delMode ? `<input type="checkbox" class="sel" ${delSel.has(t.term) ? 'checked' : ''} onclick="event.stopPropagation(); toggleDel('${esc(t.term)}', this.checked)">` : ''}
                <span class="term-name">${esc(t.term)}</span>
                <span class="term-ref">${esc(t.ref || '')}</span>
            </div>
            <div class="term-desc">${esc(t.desc)}</div>
            <div class="expand-hint">点击展开详情</div>
            <div class="term-body">${table || '<div style="color:var(--text-faint);font-size:12px;">暂无更多详情</div>'}</div>
        </div>`;
    }).join('') : '<div style="text-align:center;padding:30px;color:var(--text-faint);">没有匹配的术语</div>';

    document.getElementById('pager').innerHTML = `
        <span>共 ${list.length} 条 · 第 ${page + 1} / ${pages} 页</span>
        <button class="btn btn-sm" onclick="gotoPage(${page - 1})" ${page === 0 ? 'disabled' : ''}>‹ 上一页</button>
        <button class="btn btn-sm" onclick="gotoPage(${page + 1})" ${page >= pages - 1 ? 'disabled' : ''}>下一页 ›</button>`;

    document.getElementById('delbar').style.display = delMode ? 'flex' : 'none';
    document.getElementById('btnDel').textContent = delMode ? '✕ 退出删除' : '删除';
    document.getElementById('delCnt').textContent = delSel.size;
}

function gotoPage(p) { page = p; renderTerms(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function toggleTerm(el) {
    if (delMode) return;
    el.classList.toggle('open');
}

function clearSearch() {
    document.getElementById('q').value = '';
    page = 0;
    renderTerms();
}

// ========== 删除 ==========
function toggleDelMode() { delMode = !delMode; delSel.clear(); renderTerms(); }
function toggleDel(name, on) { on ? delSel.add(name) : delSel.delete(name); document.getElementById('delCnt').textContent = delSel.size; }
function deleteSelected() {
    if (!delSel.size) return;
    terms = terms.filter(t => !delSel.has(t.term));
    delSel.clear(); delMode = false;
    renderCategories();
    renderTerms();
}

// ========== 编辑 ==========
function addTerm() {
    openEditor('新增术语', [
        { key: 'term', label: '术语名', value: '' },
        { key: 'cat', label: '分类', value: currentCat || '' },
        { key: 'ref', label: '条目编号', value: '' },
        { key: 'desc', label: '解释', value: '' }
    ], out => {
        if (!out.term) { document.getElementById('editorTip').textContent = '术语名不能为空'; return; }
        terms.push({ term: out.term, cat: out.cat || '未分类', ref: out.ref || '', desc: out.desc || '—', table: null });
        closeEditor();
        renderCategories();
        renderTerms();
    });
}

function openEditor(title, fields, onSave) {
    document.getElementById('editorTitle').textContent = title;
    document.getElementById('editorFields').innerHTML = fields.map(f =>
        `<label>${esc(f.label)}</label><input id="ef-${esc(f.key)}" value="${esc(f.value || '')}">`).join('');
    document.getElementById('editorSave').onclick = () => {
        const out = {};
        fields.forEach(f => { out[f.key] = document.getElementById('ef-' + f.key).value.trim(); });
        onSave(out);
    };
    document.getElementById('editorTip').textContent = '';
    document.getElementById('editorWrap').classList.add('open');
}
function closeEditor() { document.getElementById('editorWrap').classList.remove('open'); }

// 初始化
renderCategories();
renderTerms();
</script>
</body>
</html>
