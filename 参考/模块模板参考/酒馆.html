<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12100d;
            --surface: #1c1a16;
            --surface-hover: #24211b;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --red: #9e3b34;
            --text-primary: #ede4d4;
            --text-secondary: #b5a990;
            --text-faint: #7a7263;
            --wood: #3a2f22;
            --paper: #e8dcc8;
            --ink: #3a3228;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 32px 50px;
            background-image:
                radial-gradient(circle at 30% 110%, rgba(158,59,52,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(201,169,106,0.08) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 20px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 10px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        .tab-bar { display: flex; gap: 8px; margin-bottom: 18px; }
        .tab-btn { padding: 8px 16px; background: transparent; border: 1px solid rgba(201,169,106,0.35); border-radius: var(--radius); color: var(--text-secondary); font-family: var(--font-body); font-size: 13px; cursor: pointer; letter-spacing: 0.08em; transition: var(--transition); }
        .tab-btn:hover { border-color: rgba(201,169,106,0.7); color: var(--gold); }
        .tab-btn.active { background: rgba(201,169,106,0.12); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,169,106,0.2); }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .btn { padding: 8px 14px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: var(--radius); color: var(--gold); font-family: var(--font-body); font-size: 12px; cursor: pointer; letter-spacing: 0.06em; transition: var(--transition); white-space: nowrap; }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); box-shadow: 0 0 15px rgba(201,169,106,0.15); }
        .btn-primary { background: rgba(201,169,106,0.12); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }
        .btn-danger { border-color: rgba(158,59,52,0.6); color: #c46b63; }
        .btn-danger:hover { background: rgba(158,59,52,0.1); box-shadow: 0 0 15px rgba(158,59,52,0.2); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        /* ========== 告示板 ========== */
        .board-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .board-toolbar .tb-spacer { flex: 1; }
        .board-container {
            background: var(--wood);
            border: 1px solid rgba(201,169,106,0.3);
            outline: 1px solid rgba(201,169,106,0.08);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
        }
        .board-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.12) 40px, rgba(0,0,0,0.12) 41px),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,0,0,0.12) 40px, rgba(0,0,0,0.12) 41px);
            pointer-events: none;
            border-radius: var(--radius);
        }
        .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; position: relative; z-index: 1; }
        .notice {
            background: var(--paper);
            color: var(--ink);
            border-radius: 2px;
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transform: rotate(-0.5deg);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .notice:nth-child(even) { transform: rotate(0.6deg); }
        .notice:nth-child(3n) { transform: rotate(-0.3deg); }
        .notice:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
        .notice .n-pin { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px rgba(201,169,106,0.6); }
        .notice .n-type { display: inline-block; padding: 2px 8px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid rgba(0,0,0,0.3); border-radius: 2px; margin-bottom: 6px; background: rgba(0,0,0,0.05); }
        .notice .n-type.rumor { border-color: rgba(158,59,52,0.6); color: #9e3b34; }
        .notice .n-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: #2a2118; margin-bottom: 4px; }
        .notice .n-desc { font-size: 12px; line-height: 1.6; color: #5a4f3e; }
        .notice .n-time { font-size: 9px; color: #8a7f6e; margin-top: 6px; }

        .pager { display: flex; align-items: center; gap: 10px; margin-top: 14px; justify-content: flex-end; font-size: 11px; color: var(--text-faint); }
        .delbar { display: none; position: sticky; bottom: 16px; background: rgba(18,16,13,0.95); border: 1px solid rgba(158,59,52,0.6); border-radius: var(--radius); padding: 10px 16px; justify-content: space-between; align-items: center; gap: 12px; z-index: 20; backdrop-filter: blur(10px); margin-top: 12px; }
        .delbar .cnt { font-size: 13px; color: var(--text-primary); }
        .delbar .cnt b { color: #c46b63; }
        .sel { width: 16px; height: 16px; cursor: pointer; margin-right: 8px; }

        /* ========== 小手机 ========== */
        .phone-container { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        .phone-frame {
            width: 340px;
            background: linear-gradient(180deg, #1e1e1e, #161616);
            border: 4px solid #2e2e2e;
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 12px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .phone-screen {
            background: #0d0f12;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 640px;
            overflow: hidden;
        }
        .phone-notch { width: 100px; height: 18px; background: #161616; border-radius: 0 0 12px 12px; margin: 0 auto; flex-shrink: 0; }
        .phone-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #aaa;
            padding: 6px 14px;
            flex-shrink: 0;
        }
        .phone-status .ph-time { font-weight: 600; color: #ddd; }
        .phone-status .ph-icons { display: flex; gap: 6px; align-items: center; }
        .ph-icons .signal-dot { width: 4px; height: 4px; border-radius: 50%; background: #c9a96a; }
        .ph-icons .battery { width: 16px; height: 7px; border: 1px solid #888; border-radius: 2px; position: relative; }
        .ph-icons .battery::after { content: ''; position: absolute; right: -3px; top: 1px; width: 2px; height: 3px; background: #888; }

        .phone-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .phone-nav { display: flex; border-top: 1px solid rgba(255,255,255,0.08); background: #111; flex-shrink: 0; }
        .phone-nav .nav-item {
            flex: 1;
            padding: 10px 0 14px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            color: #777;
            font-size: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            font-family: var(--font-body);
        }
        .phone-nav .nav-item.active { color: #c9a96a; }
        .phone-nav .nav-item .nav-icon { font-size: 16px; }
        .phone-nav .nav-item .nav-label { letter-spacing: 0.04em; }

        .feed-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .feed-header .fh-title { font-size: 14px; font-weight: 700; color: #ddd; }
        .feed-header .fh-btn { padding: 4px 8px; font-size: 9px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: 3px; color: #c9a96a; cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
        .feed-header .fh-btn:hover { background: rgba(201,169,106,0.1); }
        .char-selector { display: flex; align-items: center; gap: 6px; padding: 8px 14px; flex-shrink: 0; }
        .char-selector .cs-label { font-size: 9px; color: #777; flex-shrink: 0; }
        .char-selector select {
            flex: 1;
            padding: 5px 8px;
            background: #1a1a1a;
            border: 1px solid rgba(201,169,106,0.3);
            border-radius: 4px;
            color: #ddd;
            font-size: 10px;
            outline: none;
            font-family: var(--font-body);
        }
        .feed-list { flex: 1; overflow-y: auto; padding: 6px 14px; }

        /* 朋友圈动态 */
        .feed-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .feed-item-head { display: flex; gap: 10px; align-items: flex-start; }
        .feed-avatar { width: 38px; height: 38px; border-radius: 50%; background: #2a2f3a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #c9a96a; border: 1px solid rgba(201,169,106,0.4); }
        .feed-content { flex: 1; min-width: 0; }
        .feed-name { font-size: 11px; color: #c9a96a; font-weight: 600; margin-bottom: 3px; }
        .feed-text { font-size: 12px; color: #ccc; line-height: 1.6; }
        .feed-time { font-size: 9px; color: #555; margin-top: 4px; cursor: pointer; }
        .feed-time:hover { color: #c9a96a; }
        .feed-del { position: absolute; top: 8px; right: 0; width: 20px; height: 20px; border-radius: 4px; background: rgba(158,59,52,0.15); border: 1px solid rgba(158,59,52,0.5); color: #c46b63; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-family: var(--font-body); }
        .feed-item:hover .feed-del { opacity: 1; }

        /* 点赞评论操作栏 */
        .feed-actions { display: flex; gap: 12px; margin-top: 8px; padding-left: 48px; }
        .feed-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid rgba(201,169,106,0.25);
            border-radius: 12px;
            color: #888;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
        }
        .feed-action-btn:hover { border-color: rgba(201,169,106,0.6); color: #c9a96a; }
        .feed-action-btn.liked { background: rgba(201,169,106,0.15); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }
        .feed-action-btn .fa-icon { font-size: 11px; }

        /* 评论区 */
        .feed-comments { margin-top: 8px; padding-left: 48px; display: none; }
        .feed-item.comments-open .feed-comments { display: block; }
        .comment-item { display: flex; gap: 6px; padding: 4px 0; }
        .comment-avatar { width: 20px; height: 20px; border-radius: 50%; background: #2a2f3a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 7px; color: #c9a96a; border: 1px solid rgba(201,169,106,0.3); }
        .comment-body { flex: 1; }
        .comment-name { font-size: 9px; color: #c9a96a; font-weight: 600; display: inline; }
        .comment-text { font-size: 10px; color: #bbb; display: inline; margin-left: 4px; }
        .comment-del { color: #c46b63; font-size: 8px; cursor: pointer; opacity: 0; transition: var(--transition); margin-left: 4px; }
        .comment-item:hover .comment-del { opacity: 1; }
        .comment-input-row { display: flex; gap: 6px; margin-top: 6px; }
        .comment-input { flex: 1; padding: 5px 8px; background: #1a1a1a; border: 1px solid rgba(201,169,106,0.25); border-radius: 10px; color: #ccc; font-size: 10px; outline: none; font-family: var(--font-body); }
        .comment-send { padding: 5px 10px; background: rgba(201,169,106,0.12); border: 1px solid rgba(201,169,106,0.5); border-radius: 10px; color: #c9a96a; font-size: 10px; cursor: pointer; font-family: var(--font-body); }

        .feed-input-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .feed-input { flex: 1; padding: 7px 12px; background: #1a1a1a; border: 1px solid rgba(201,169,106,0.3); border-radius: 18px; color: #ccc; font-size: 11px; outline: none; font-family: var(--font-body); }
        .feed-send { padding: 7px 14px; background: rgba(201,169,106,0.15); border: 1px solid rgba(201,169,106,0.6); border-radius: 18px; color: var(--gold-bright); font-size: 11px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
        .feed-send:hover { background: rgba(201,169,106,0.25); }

        /* 群聊 */
        .group-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .group-header .gh-title { font-size: 14px; font-weight: 700; color: #ddd; }
        .group-header .gh-add { width: 22px; height: 22px; border-radius: 4px; background: rgba(201,169,106,0.1); border: 1px solid rgba(201,169,106,0.5); color: #c9a96a; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
        .group-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
        .ph-group-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; transition: var(--transition); position: relative; }
        .ph-group-item:hover { background: rgba(255,255,255,0.05); }
        .ph-group-item:hover .group-del { opacity: 1; }
        .ph-group-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .ph-group-info { flex: 1; min-width: 0; }
        .ph-group-name { font-size: 12px; font-weight: 600; color: #ddd; }
        .ph-group-last { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .ph-group-time { font-size: 9px; color: #555; flex-shrink: 0; }
        .group-del { position: absolute; top: 8px; right: 4px; width: 18px; height: 18px; border-radius: 4px; background: rgba(158,59,52,0.15); border: 1px solid rgba(158,59,52,0.5); color: #c46b63; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-family: var(--font-body); }

        .chat-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .chat-back { width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(201,169,106,0.4); background: transparent; color: #c9a96a; font-size: 13px; cursor: pointer; flex-shrink: 0; font-family: var(--font-body); }
        .chat-name { font-size: 12px; font-weight: 600; color: #ddd; flex: 1; }
        .chat-sub { font-size: 9px; color: #555; }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; position: relative; }
        .chat-msg.self { align-self: flex-end; flex-direction: row-reverse; }
        .chat-msg:hover .chat-msg-del { opacity: 1; }
        .chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: #2a2f3a; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #c9a96a; border: 1px solid rgba(201,169,106,0.4); flex-shrink: 0; }
        .chat-bubble { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px 12px 12px 12px; padding: 7px 11px; font-size: 11px; color: #ccc; line-height: 1.5; }
        .chat-msg.self .chat-bubble { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.4); border-radius: 12px 4px 12px 12px; color: #e8d5a4; }
        .chat-who { font-size: 9px; color: #777; margin-bottom: 2px; }
        .chat-time-editable { font-size: 8px; color: #555; cursor: pointer; margin-top: 2px; }
        .chat-time-editable:hover { color: #c9a96a; }
        .chat-msg-del { position: absolute; bottom: -4px; right: 0; width: 16px; height: 16px; border-radius: 4px; background: rgba(158,59,52,0.2); border: 1px solid rgba(158,59,52,0.5); color: #c46b63; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-family: var(--font-body); }
        .chat-input-bar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .chat-input { flex: 1; padding: 7px 12px; background: #1a1a1a; border: 1px solid rgba(201,169,106,0.3); border-radius: 18px; color: #ccc; font-size: 11px; outline: none; font-family: var(--font-body); }
        .chat-send { padding: 7px 14px; background: rgba(201,169,106,0.15); border: 1px solid rgba(201,169,106,0.6); border-radius: 18px; color: var(--gold-bright); font-size: 11px; cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
        .chat-send:hover { background: rgba(201,169,106,0.25); }

        /* ========== 右侧操作台 ========== */
        .phone-tools { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 14px; }
        .pt-card { background: var(--surface); border: 1px solid rgba(201,169,106,0.2); outline: 1px solid rgba(201,169,106,0.06); outline-offset: 4px; border-radius: var(--radius); padding: 16px 18px; }
        .pt-card .pt-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.06em; }
        .pt-card .pt-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 12px; }
        .pt-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .pt-input-row .pt-input {
            flex: 1;
            padding: 7px 10px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(201,169,106,0.25);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            font-family: var(--font-body);
            transition: var(--transition);
        }
        .pt-input-row .pt-input:focus { border-color: rgba(201,169,106,0.6); }
        .pt-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 140px; overflow-y: auto; padding: 4px 0; }
        .pt-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            font-size: 11px;
            border: 1px solid rgba(201,169,106,0.3);
            border-radius: 2px;
            color: var(--text-secondary);
            background: rgba(201,169,106,0.04);
            cursor: pointer;
            transition: var(--transition);
        }
        .pt-chip:hover { background: var(--surface-hover); border-color: rgba(201,169,106,0.6); color: var(--gold); }
        .pt-chip.active { background: rgba(201,169,106,0.15); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }
        .pt-chip .pt-chip-del { color: var(--text-faint); font-size: 10px; cursor: pointer; transition: var(--transition); }
        .pt-chip .pt-chip-del:hover { color: #c46b63; }
        .pt-item-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius); transition: var(--transition); }
        .pt-item-row:hover { background: rgba(201,169,106,0.04); }
        .pt-item-row .pt-item-text { flex: 1; font-size: 12px; color: var(--text-secondary); }
        .pt-item-row .pt-item-del { width: 20px; height: 20px; border-radius: 4px; background: rgba(158,59,52,0.1); border: 1px solid rgba(158,59,52,0.4); color: #c46b63; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-family: var(--font-body); }
        .pt-item-row:hover .pt-item-del { opacity: 1; }

        /* 弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 20px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px; padding: 20px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-head { margin-bottom: 14px; }
        .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal label { display: block; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 10px; transition: var(--transition); }
        .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: rgba(201,169,106,0.6); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>酒馆</h1>
        <div class="sub">市井灯火 · 告示板与小手机</div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-view="board" onclick="switchView('board')">告示板</button>
        <button class="tab-btn" data-view="phone" onclick="switchView('phone')">小手机</button>
    </div>

    <!-- ========== 告示板视图 ========== -->
    <div class="view active" id="view-board">
        <div class="board-toolbar">
            <button class="btn btn-sm" onclick="addNotice()">＋ 张贴告示</button>
            <button class="btn btn-sm" onclick="addRumor()">＋ 记录传闻</button>
            <button class="btn btn-danger btn-sm" onclick="toggleDelMode()" id="btnDel">删除</button>
            <div class="tb-spacer"></div>
            <span style="font-size:11px;color:var(--text-faint);" id="boardCount"></span>
        </div>
        <div class="board-container">
            <div class="board-grid" id="boardGrid"></div>
        </div>
        <div class="pager" id="pager"></div>
        <div class="delbar" id="delbar">
            <span class="cnt">已选 <b id="delCnt">0</b> 项</span>
            <button class="btn btn-primary btn-sm" onclick="deleteSelected()">确认删除</button>
            <button class="btn btn-sm" onclick="toggleDelMode()">取消</button>
        </div>
    </div>

    <!-- ========== 小手机视图 ========== -->
    <div class="view" id="view-phone">
        <div class="phone-container">
            <div class="phone-frame">
                <div class="phone-screen">
                    <div class="phone-notch"></div>
                    <div class="phone-status">
                        <span class="ph-time" id="phTime">12:00</span>
                        <div class="ph-icons">
                            <span class="signal-dot"></span><span class="signal-dot"></span><span class="signal-dot"></span>
                            <span>✦</span>
                            <span class="battery"></span>
                        </div>
                    </div>
                    <div class="char-selector">
                        <span class="cs-label">扮演</span>
                        <select id="charSelect" onchange="updateChar()"></select>
                    </div>
                    <div class="phone-content">
                        <div id="ph-feed" style="display:flex;flex-direction:column;flex:1;min-height:0;">
                            <div class="feed-header">
                                <span class="fh-title">朋友圈</span>
                                <button class="fh-btn" onclick="switchPhoneTab('chat')">群聊</button>
                            </div>
                            <div class="feed-list" id="feedList"></div>
                            <div class="feed-input-row">
                                <input class="feed-input" id="feedInput" placeholder="以当前角色发条动态…">
                                <button class="feed-send" onclick="sendFeed()">发送</button>
                            </div>
                        </div>
                        <div id="ph-group-list-view" style="display:none;flex-direction:column;flex:1;min-height:0;">
                            <div class="group-header">
                                <span class="gh-title">群聊</span>
                                <button class="gh-add" onclick="addGroup()">＋</button>
                            </div>
                            <div class="group-list" id="groupList"></div>
                        </div>
                        <div id="ph-chat-view" style="display:none;flex-direction:column;flex:1;min-height:0;">
                            <div class="chat-head">
                                <button class="chat-back" onclick="backToGroups()">‹</button>
                                <div style="flex:1;min-width:0;">
                                    <div class="chat-name" id="chatName">群聊</div>
                                    <div class="chat-sub" id="chatSub"></div>
                                </div>
                            </div>
                            <div class="chat-msgs" id="chatMsgs"></div>
                            <div class="chat-input-bar">
                                <input class="chat-input" id="msgInput" placeholder="以当前角色发言…">
                                <button class="chat-send" onclick="sendMsg()">发送</button>
                            </div>
                        </div>
                    </div>
                    <div class="phone-nav">
                        <button class="nav-item active" data-nav="feed" onclick="switchPhoneTab('feed')">
                            <span class="nav-icon">◉</span><span class="nav-label">朋友圈</span>
                        </button>
                        <button class="nav-item" data-nav="chat" onclick="switchPhoneTab('chat')">
                            <span class="nav-icon">✦</span><span class="nav-label">群聊</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧操作台 -->
            <div class="phone-tools">
                <div class="pt-card">
                    <div class="pt-title">角色管理</div>
                    <div class="pt-desc">添加或删除可扮演的角色，点击切换当前身份。</div>
                    <div class="pt-input-row">
                        <input class="pt-input" id="newCharInput" placeholder="输入新角色名…" onkeydown="if(event.key==='Enter')addCharacter()">
                        <button class="btn btn-sm" onclick="addCharacter()">添加</button>
                    </div>
                    <div class="pt-list" id="charChipList"></div>
                </div>

                <div class="pt-card">
                    <div class="pt-title">朋友圈编辑</div>
                    <div class="pt-desc">添加、删除动态，或在手机内点赞评论。</div>
                    <div class="pt-input-row">
                        <input class="pt-input" id="newFeedText" placeholder="输入动态内容…" onkeydown="if(event.key==='Enter')addFeedFromPanel()">
                        <button class="btn btn-sm" onclick="addFeedFromPanel()">添加</button>
                    </div>
                    <div class="pt-list" id="feedEditList" style="flex-direction:column;align-items:stretch;"></div>
                </div>

                <div class="pt-card">
                    <div class="pt-title">群聊编辑</div>
                    <div class="pt-desc">添加或删除群聊。</div>
                    <div class="pt-input-row">
                        <input class="pt-input" id="newGroupInput" placeholder="输入群聊名称…" onkeydown="if(event.key==='Enter')addGroupFromPanel()">
                        <button class="btn btn-sm" onclick="addGroupFromPanel()">添加</button>
                    </div>
                    <div class="pt-list" id="groupEditList" style="flex-direction:column;align-items:stretch;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 告示新增弹窗 -->
<div class="modal-overlay" id="noticeModal" onclick="if(event.target===this)closeNoticeModal()">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title" id="noticeModalTitle">张贴告示</div>
            <button class="modal-close" onclick="closeNoticeModal()">✕</button>
        </div>
        <label>类型</label>
        <select id="noticeType"><option value="告示">告示</option><option value="传闻">传闻</option></select>
        <label>标题</label>
        <input id="noticeTitle" placeholder="标题…">
        <label>内容</label>
        <textarea id="noticeDesc" rows="3" placeholder="内容…"></textarea>
        <div class="modal-btns">
            <button class="btn btn-sm" onclick="closeNoticeModal()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="saveNotice()">保存</button>
        </div>
    </div>
</div>

<!-- 群聊新增弹窗 -->
<div class="modal-overlay" id="groupModal" onclick="if(event.target===this)closeGroupModal()">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title">新建群聊</div>
            <button class="modal-close" onclick="closeGroupModal()">✕</button>
        </div>
        <label>群聊名称</label>
        <input id="groupNameInput" placeholder="群聊名称…">
        <div class="modal-btns">
            <button class="btn btn-sm" onclick="closeGroupModal()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="saveGroup()">创建</button>
        </div>
    </div>
</div>

<!-- 时间编辑弹窗 -->
<div class="modal-overlay" id="timeModal" onclick="if(event.target===this)closeTimeModal()">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title">修改时间</div>
            <button class="modal-close" onclick="closeTimeModal()">✕</button>
        </div>
        <label>时间</label>
        <input id="timeInput" placeholder="如：昨天 20:00 / 星陨2000年7月">
        <div class="modal-btns">
            <button class="btn btn-sm" onclick="closeTimeModal()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="saveTimeEdit()">保存</button>
        </div>
    </div>
</div>

<script>
// ========== 数据 ==========
let notices = [
    { type: '告示', title: '示例告示一', desc: '这是告示的占位内容。', time: '星陨2000年7月' },
    { type: '传闻', title: '示例传闻一', desc: '这是传闻的占位内容。', time: '星陨2000年7月' },
    { type: '告示', title: '示例告示二', desc: '另一条告示的占位内容。', time: '星陨2000年7月' },
    { type: '传闻', title: '示例传闻二', desc: '另一条传闻的占位内容。', time: '星陨2000年7月' },
    { type: '告示', title: '示例告示三', desc: '第三张告示的占位内容。', time: '星陨2000年7月' },
    { type: '传闻', title: '示例传闻三', desc: '传闻通常和隐藏情报相关。', time: '星陨2000年7月' }
];

let characters = ['我', '角色A', '角色B', '角色C', '角色D', '角色E'];
let currentChar = '我';

let feed = [
    { name: '角色A', text: '今天去了希尼尔城，街上人真多。', time: '刚刚', likes: 3, liked: false, comments: [
        { name: '角色B', text: '听说城里有新的魔法展览。' }
    ] },
    { name: '角色B', text: '有人在酒馆听到关于黄昏神殿的新传闻。', time: '半小时前', likes: 1, liked: false, comments: [] },
    { name: '角色C', text: '沙漠的星星很好看，想去的可以结伴。', time: '一小时前', likes: 5, liked: true, comments: [
        { name: '角色D', text: '什么时候？' },
        { name: '角色C', text: '明天晚上出发。' }
    ] }
];

let groups = [
    { id: 'g1', name: '酒馆闲聊群', color: '#8a6d3b', icon: '✦', last: '今天天气不错', time: '12:00', messages: [
        { from: '角色A', text: '有人吗？', time: '11:30' },
        { from: '角色B', text: '在的，怎么了？', time: '11:32' }
    ] },
    { id: 'g2', name: '冒险者小队', color: '#3f7c9c', icon: '✦', last: '明天出发去沙漠', time: '昨天', messages: [
        { from: '角色C', text: '明天出发去沙漠，谁要一起？', time: '昨天 20:00' }
    ] },
    { id: 'g3', name: '学院吐槽组', color: '#6b4a7a', icon: '✦', last: '作业写不完', time: '昨天', messages: [
        { from: '角色E', text: '魔法式作业写不完了……', time: '昨天 23:00' }
    ] }
];

let delMode = false;
let delSel = new Set();
let page = 0;
const PAGE_SIZE = 6;
let currentGroup = null;
let timeEditTarget = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ========== 视图切换 ==========
function switchView(v) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    document.getElementById('view-board').classList.toggle('active', v === 'board');
    document.getElementById('view-phone').classList.toggle('active', v === 'phone');
    if (v === 'phone') { updateTime(); renderCharSelect(); renderCharChips(); renderFeed(); renderFeedEdit(); renderGroupList(); renderGroupEdit(); }
    if (v === 'board') renderBoard();
}

function switchPhoneTab(t) {
    document.querySelectorAll('.phone-nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === t));
    document.getElementById('ph-feed').style.display = t === 'feed' ? 'flex' : 'none';
    document.getElementById('ph-group-list-view').style.display = t === 'chat' ? 'flex' : 'none';
    document.getElementById('ph-chat-view').style.display = 'none';
    if (t === 'chat') renderGroupList();
}

// ========== 时间编辑 ==========
function openTimeModal(target) {
    timeEditTarget = target;
    document.getElementById('timeInput').value = '';
    document.getElementById('timeModal').classList.add('open');
}
function closeTimeModal() { document.getElementById('timeModal').classList.remove('open'); timeEditTarget = null; }
function saveTimeEdit() {
    const newTime = document.getElementById('timeInput').value.trim();
    if (!newTime || !timeEditTarget) return;
    if (timeEditTarget.type === 'feed') {
        feed[timeEditTarget.index].time = newTime;
        renderFeed(); renderFeedEdit();
    } else if (timeEditTarget.type === 'msg') {
        const g = groups.find(x => x.id === timeEditTarget.groupId);
        if (g && g.messages && g.messages[timeEditTarget.index]) {
            g.messages[timeEditTarget.index].time = newTime;
            renderMsgs();
        }
    } else if (timeEditTarget.type === 'group') {
        const g = groups[timeEditTarget.index];
        if (g) { g.time = newTime; renderGroupList(); renderGroupEdit(); }
    }
    closeTimeModal();
}

// ========== 告示板 ==========
function renderBoard() {
    const pages = Math.max(1, Math.ceil(notices.length / PAGE_SIZE));
    if (page >= pages) page = 0;
    const slice = notices.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    document.getElementById('boardGrid').innerHTML = slice.map((n, i) => {
        const idx = page * PAGE_SIZE + i;
        return `<div class="notice">
            <div class="n-pin"></div>
            ${delMode ? `<input type="checkbox" class="sel" ${delSel.has(idx) ? 'checked' : ''} onclick="toggleDel(${idx}, this.checked)">` : ''}
            <span class="n-type ${n.type === '传闻' ? 'rumor' : ''}">${esc(n.type)}</span>
            <div class="n-title">${esc(n.title)}</div>
            <div class="n-desc">${esc(n.desc)}</div>
            <div class="n-time">${esc(n.time || '')}</div>
        </div>`;
    }).join('') || '<div style="color:var(--text-faint);text-align:center;padding:20px;">暂无告示</div>';
    document.getElementById('boardCount').textContent = `共 ${notices.length} 条`;
    document.getElementById('pager').innerHTML = `
        <span>第 ${page + 1} / ${pages} 页</span>
        <button class="btn btn-sm" onclick="gotoPage(${page - 1})" ${page === 0 ? 'disabled' : ''}>‹ 上一页</button>
        <button class="btn btn-sm" onclick="gotoPage(${page + 1})" ${page >= pages - 1 ? 'disabled' : ''}>下一页 ›</button>`;
    document.getElementById('delbar').style.display = delMode ? 'flex' : 'none';
    document.getElementById('btnDel').textContent = delMode ? '✕ 退出删除' : '删除';
    document.getElementById('delCnt').textContent = delSel.size;
}

function gotoPage(p) { page = p; renderBoard(); }
function toggleDelMode() { delMode = !delMode; delSel.clear(); renderBoard(); }
function toggleDel(idx, on) { on ? delSel.add(idx) : delSel.delete(idx); document.getElementById('delCnt').textContent = delSel.size; }
function deleteSelected() {
    if (!delSel.size) return;
    const idxs = [...delSel].sort((a, b) => b - a);
    idxs.forEach(i => notices.splice(i, 1));
    delSel.clear(); delMode = false; renderBoard();
}
function openNoticeModal(title, type) {
    document.getElementById('noticeModalTitle').textContent = title;
    document.getElementById('noticeType').value = type;
    document.getElementById('noticeTitle').value = '';
    document.getElementById('noticeDesc').value = '';
    document.getElementById('noticeModal').classList.add('open');
}
function addNotice() { openNoticeModal('张贴告示', '告示'); }
function addRumor() { openNoticeModal('记录传闻', '传闻'); }
function closeNoticeModal() { document.getElementById('noticeModal').classList.remove('open'); }
function saveNotice() {
    const type = document.getElementById('noticeType').value;
    const title = document.getElementById('noticeTitle').value.trim();
    const desc = document.getElementById('noticeDesc').value.trim();
    if (!title || !desc) return;
    notices.unshift({ type, title, desc, time: '星陨2000年7月' });
    closeNoticeModal(); page = 0; renderBoard();
}

// ========== 小手机 ==========
function updateTime() {
    const t = new Date();
    document.getElementById('phTime').textContent = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
}

// 角色管理
function renderCharSelect() {
    document.getElementById('charSelect').innerHTML = characters.map(c => `<option value="${esc(c)}" ${c === currentChar ? 'selected' : ''}>${esc(c)}</option>`).join('');
}
function renderCharChips() {
    document.getElementById('charChipList').innerHTML = characters.map(c => `
        <span class="pt-chip ${c === currentChar ? 'active' : ''}" onclick="setChar('${esc(c)}')">
            ${esc(c)}
            ${c !== '我' ? `<span class="pt-chip-del" onclick="event.stopPropagation(); deleteChar('${esc(c)}')">✕</span>` : ''}
        </span>`).join('');
}
function setChar(c) { currentChar = c; renderCharSelect(); renderCharChips(); }
function addCharacter() {
    const name = document.getElementById('newCharInput').value.trim();
    if (!name || characters.includes(name)) return;
    characters.push(name);
    document.getElementById('newCharInput').value = '';
    renderCharSelect(); renderCharChips();
}
function deleteChar(c) {
    characters = characters.filter(x => x !== c);
    if (currentChar === c) currentChar = '我';
    renderCharSelect(); renderCharChips();
}
function updateChar() { currentChar = document.getElementById('charSelect').value; renderCharChips(); }

// 朋友圈
function renderFeed() {
    document.getElementById('feedList').innerHTML = feed.map((f, i) => `
        <div class="feed-item ${f.commentsOpen ? 'comments-open' : ''}" id="feed-item-${i}">
            <div class="feed-item-head">
                <div class="feed-avatar">${esc(f.name[0])}</div>
                <div class="feed-content">
                    <div class="feed-name">${esc(f.name)}</div>
                    <div class="feed-text">${esc(f.text)}</div>
                    <div class="feed-time" onclick="openTimeModal({type:'feed', index:${i}})" title="点击修改时间">${esc(f.time)}</div>
                </div>
                <button class="feed-del" onclick="deleteFeed(${i})" title="删除">✕</button>
            </div>
            <div class="feed-actions">
                <button class="feed-action-btn ${f.liked ? 'liked' : ''}" onclick="toggleLike(${i})">
                    <span class="fa-icon">♥</span>
                    <span>${f.likes}</span>
                </button>
                <button class="feed-action-btn" onclick="toggleComments(${i})">
                    <span class="fa-icon">✦</span>
                    <span>评论 ${(f.comments || []).length}</span>
                </button>
            </div>
            <div class="feed-comments">
                ${(f.comments || []).map((c, ci) => `
                    <div class="comment-item">
                        <div class="comment-avatar">${esc(c.name[0])}</div>
                        <div class="comment-body">
                            <span class="comment-name">${esc(c.name)}</span>
                            <span class="comment-text">${esc(c.text)}</span>
                            <button class="comment-del" onclick="deleteComment(${i}, ${ci})">✕</button>
                        </div>
                    </div>`).join('')}
                <div class="comment-input-row">
                    <input class="comment-input" id="comment-input-${i}" placeholder="评论…" onkeydown="if(event.key==='Enter')addComment(${i})">
                    <button class="comment-send" onclick="addComment(${i})">发送</button>
                </div>
            </div>
        </div>`).join('') || '<div style="color:#666;text-align:center;padding:20px;">暂无动态</div>';
}
function renderFeedEdit() {
    document.getElementById('feedEditList').innerHTML = feed.map((f, i) => `
        <div class="pt-item-row">
            <span class="pt-item-text">${esc(f.name)}：${esc(f.text)}</span>
            <button class="pt-item-del" onclick="deleteFeed(${i})">✕</button>
        </div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">暂无动态</div>';
}
function sendFeed() {
    const text = document.getElementById('feedInput').value.trim();
    if (!text) return;
    feed.unshift({ name: currentChar, text, time: '刚刚', likes: 0, liked: false, comments: [] });
    document.getElementById('feedInput').value = '';
    renderFeed(); renderFeedEdit();
}
function addFeedFromPanel() {
    const text = document.getElementById('newFeedText').value.trim();
    if (!text) return;
    feed.unshift({ name: currentChar, text, time: '刚刚', likes: 0, liked: false, comments: [] });
    document.getElementById('newFeedText').value = '';
    renderFeed(); renderFeedEdit();
}
function deleteFeed(i) { feed.splice(i, 1); renderFeed(); renderFeedEdit(); }

// 点赞评论
function toggleLike(i) {
    feed[i].liked = !feed[i].liked;
    feed[i].likes += feed[i].liked ? 1 : -1;
    renderFeed();
}
function toggleComments(i) {
    feed[i].commentsOpen = !feed[i].commentsOpen;
    renderFeed();
}
function addComment(i) {
    const input = document.getElementById(`comment-input-${i}`);
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    feed[i].comments = feed[i].comments || [];
    feed[i].comments.push({ name: currentChar, text });
    input.value = '';
    renderFeed();
    // 保持评论区展开
    feed[i].commentsOpen = true;
    renderFeed();
}
function deleteComment(fi, ci) {
    feed[fi].comments.splice(ci, 1);
    renderFeed();
}

// 群聊
function renderGroupList() {
    document.getElementById('groupList').innerHTML = groups.map((g, i) => `
        <div class="ph-group-item" onclick="openChat('${g.id}')">
            <div class="ph-group-ic" style="background:${g.color}">${esc(g.icon)}</div>
            <div class="ph-group-info">
                <div class="ph-group-name">${esc(g.name)}</div>
                <div class="ph-group-last">${esc(g.last || '')}</div>
            </div>
            <span class="ph-group-time" onclick="event.stopPropagation(); openTimeModal({type:'group', index:${i}})" title="点击修改时间">${esc(g.time || '')}</span>
            <button class="group-del" onclick="event.stopPropagation(); deleteGroup(${i})" title="删除">✕</button>
        </div>`).join('') || '<div style="color:#666;text-align:center;padding:20px;">暂无群聊</div>';
}
function renderGroupEdit() {
    document.getElementById('groupEditList').innerHTML = groups.map((g, i) => `
        <div class="pt-item-row">
            <span class="pt-item-text">${esc(g.name)}</span>
            <button class="pt-item-del" onclick="deleteGroup(${i})">✕</button>
        </div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">暂无群聊</div>';
}
function addGroup() { document.getElementById('groupNameInput').value = ''; document.getElementById('groupModal').classList.add('open'); }
function addGroupFromPanel() {
    const name = document.getElementById('newGroupInput').value.trim();
    if (!name) return;
    const colors = ['#8a6d3b', '#3f7c9c', '#6b4a7a', '#5f8f7c', '#9e3b34'];
    groups.unshift({ id: 'g' + Date.now(), name, color: colors[Math.floor(Math.random() * colors.length)], icon: '✦', last: '新建的群聊', time: '刚刚', messages: [] });
    document.getElementById('newGroupInput').value = '';
    renderGroupList(); renderGroupEdit();
}
function closeGroupModal() { document.getElementById('groupModal').classList.remove('open'); }
function saveGroup() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name) return;
    const colors = ['#8a6d3b', '#3f7c9c', '#6b4a7a', '#5f8f7c', '#9e3b34'];
    groups.unshift({ id: 'g' + Date.now(), name, color: colors[Math.floor(Math.random() * colors.length)], icon: '✦', last: '新建的群聊', time: '刚刚', messages: [] });
    closeGroupModal();
    renderGroupList(); renderGroupEdit();
}
function deleteGroup(i) { groups.splice(i, 1); renderGroupList(); renderGroupEdit(); }

function openChat(id) {
    const g = groups.find(x => x.id === id);
    if (!g) return;
    currentGroup = g;
    document.getElementById('ph-feed').style.display = 'none';
    document.getElementById('ph-group-list-view').style.display = 'none';
    document.getElementById('ph-chat-view').style.display = 'flex';
    document.getElementById('chatName').textContent = g.name;
    document.getElementById('chatSub').textContent = (g.messages || []).length + ' 条消息';
    renderMsgs();
}
function backToGroups() {
    currentGroup = null;
    document.getElementById('ph-chat-view').style.display = 'none';
    document.getElementById('ph-group-list-view').style.display = 'flex';
    renderGroupList();
}
function renderMsgs() {
    if (!currentGroup) return;
    document.getElementById('chatMsgs').innerHTML = (currentGroup.messages || []).map((m, i) => `
        <div class="chat-msg ${m.from === currentChar ? 'self' : ''}">
            <div class="chat-avatar">${esc(m.from[0])}</div>
            <div>
                <div class="chat-who">${esc(m.from)}</div>
                <div class="chat-bubble">${esc(m.text)}</div>
                <div class="chat-time-editable" onclick="openTimeModal({type:'msg', groupId:'${currentGroup.id}', index:${i}})" title="点击修改时间">${esc(m.time || '')}</div>
            </div>
            <button class="chat-msg-del" onclick="deleteMsg(${i})" title="删除">✕</button>
        </div>`).join('') || '<div style="color:#666;text-align:center;padding:20px;">暂无消息</div>';
    const box = document.getElementById('chatMsgs');
    box.scrollTop = box.scrollHeight;
}
function sendMsg() {
    const text = document.getElementById('msgInput').value.trim();
    if (!text || !currentGroup) return;
    const t = new Date();
    const timeStr = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    currentGroup.messages = currentGroup.messages || [];
    currentGroup.messages.push({ from: currentChar, text, time: timeStr });
    currentGroup.last = text;
    currentGroup.time = timeStr;
    document.getElementById('msgInput').value = '';
    renderMsgs();
    renderGroupList(); renderGroupEdit();
}
function deleteMsg(i) {
    if (!currentGroup) return;
    currentGroup.messages.splice(i, 1);
    renderMsgs();
    renderGroupList(); renderGroupEdit();
}

// 初始化
renderBoard();
updateTime();
renderCharSelect();
renderCharChips();
renderFeed();
renderFeedEdit();
renderGroupList();
renderGroupEdit();
</script>
</body>
</html>
