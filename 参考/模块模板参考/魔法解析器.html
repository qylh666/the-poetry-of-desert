<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法解析器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1116;
            --surface: #181b21;
            --surface-hover: #1e222a;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --purple: #6b4a7a;
            --purple-bright: #9b7dc9;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 4px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(201,169,106,0.08) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(107,74,122,0.1) 0%, transparent 45%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 18px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold-bright); text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 9px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        /* ========== 卡片 ========== */
        .card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        /* ========== 输入视图 ========== */
        #inputView { display: block; }
        #inputView.hidden { display: none; }

        .input-row { display: flex; gap: 8px; align-items: stretch; }
        .magic-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(201,169,106,0.25);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            resize: vertical;
            min-height: 60px;
            line-height: 1.7;
        }
        .magic-input:focus { border-color: rgba(201,169,106,0.6); box-shadow: 0 0 15px rgba(201,169,106,0.1); }
        .magic-input::placeholder { color: var(--text-faint); }

        .param-row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        .param-group { display: flex; align-items: center; gap: 5px; }
        .param-group .pg-label { font-size: 10px; color: var(--gold-mid); letter-spacing: 0.08em; text-transform: uppercase; }
        .param-group select, .param-group input {
            padding: 6px 10px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(201,169,106,0.25);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .param-group input[type="number"] {
            width: 70px;
            cursor: text;
        }
        .param-group input[type="number"]:focus { border-color: rgba(201,169,106,0.6); }

        .btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.4);
            border-radius: var(--radius);
            color: var(--gold);
            font-family: var(--font-body);
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn:hover { background: var(--surface-hover); border-color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,169,106,0.15); }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-mid), var(--gold));
            border-color: var(--gold-bright);
            color: #1a1512;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 24px;
        }
        .btn-primary:hover { box-shadow: 0 0 25px rgba(201,169,106,0.4); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }

        /* 元素介绍 */
        .element-intro {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(201,169,106,0.15);
        }
        .element-intro .ei-title {
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .element-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 6px;
        }
        .element-tag {
            padding: 5px 8px;
            font-size: 10px;
            text-align: center;
            border-radius: 4px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(201,169,106,0.15);
            cursor: default;
            transition: var(--transition);
        }
        .element-tag:hover { border-color: rgba(201,169,106,0.5); background: rgba(201,169,106,0.05); }
        .element-tag .et-symbol { font-size: 14px; display: block; margin-bottom: 1px; }
        .element-tag .et-name { color: var(--text-secondary); font-size: 11px; display: block; margin-bottom: 1px; }
        .element-tag .et-desc { color: var(--text-faint); font-size: 8px; display: block; line-height: 1.3; }

        /* 咒语风格 */
        .style-intro {
            margin-top: 10px;
        }
        .style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        @media (max-width: 500px) { .style-grid { grid-template-columns: 1fr; } }
        .style-card {
            padding: 10px 12px;
            border-radius: var(--radius);
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(201,169,106,0.15);
        }
        .style-card.traditional { border-left: 3px solid var(--gold); }
        .style-card.simple { border-left: 3px solid var(--purple-bright); }
        .style-card .sc-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
        .style-card.traditional .sc-name { color: var(--gold); }
        .style-card.simple .sc-name { color: var(--purple-bright); }
        .style-card .sc-desc { font-size: 10px; color: var(--text-faint); line-height: 1.5; }
        .style-card .sc-example { font-size: 10px; color: var(--text-secondary); font-style: italic; margin-top: 4px; }

        /* 上一次解析 */
        .history-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(201,169,106,0.15);
        }
        .history-section .hs-title {
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .history-item {
            padding: 8px 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(107,74,122,0.25);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 6px;
        }
        .history-item:hover { border-color: var(--purple-bright); background: rgba(107,74,122,0.08); }
        .history-item .hi-formula {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--gold-bright);
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .hi-time {
            font-size: 9px;
            color: var(--text-faint);
            margin-top: 2px;
        }
        .history-empty {
            font-size: 11px;
            color: var(--text-faint);
            text-align: center;
            padding: 8px 0;
        }

        /* ========== 解析视图 ========== */
        #resultView { display: none; }
        #resultView.visible { display: block; }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .result-header .rh-back {
            font-size: 16px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--text-secondary);
            transition: var(--transition);
            border: 1px solid rgba(201,169,106,0.3);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .result-header .rh-back:hover { color: var(--gold); border-color: var(--gold); background: var(--surface-hover); }
        .result-header .rh-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 700;
            color: var(--gold-bright);
            letter-spacing: 0.05em;
        }

        /* 思考进度 */
        .thinking-box { display: none; padding: 14px 16px; }
        .thinking-box.visible { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .thinking-stage { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .progress-track { width: 100%; height: 4px; background: rgba(201,169,106,0.12); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-mid), var(--gold), var(--purple-bright)); border-radius: 2px; width: 0%; transition: width 0.15s ease; }
        .progress-steps { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .step-dot { font-size: 9px; padding: 2px 8px; border-radius: 10px; background: rgba(201,169,106,0.06); border: 1px solid rgba(201,169,106,0.2); color: var(--text-faint); letter-spacing: 0.05em; transition: var(--transition); }
        .step-dot.active { background: rgba(107,74,122,0.15); border-color: var(--purple-bright); color: var(--purple-bright); }
        .step-dot.done { background: rgba(201,169,106,0.1); border-color: var(--gold); color: var(--gold); }

        /* 解析结果内容 */
        .result-content { display: none; }
        .result-content.visible { display: block; animation: fadeIn 0.4s ease; }
        .result-section { margin-bottom: 14px; }
        .result-section .rs-title {
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-section .rs-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,169,106,0.3), transparent); }
        .formula-block {
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.8;
            padding: 12px 16px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(107,74,122,0.35);
            border-radius: var(--radius);
            color: var(--gold-bright);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .formula-block .fb-highlight { color: var(--purple-bright); }
        .param-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .param-table th { font-family: var(--font-display); font-size: 11px; color: var(--gold); text-align: left; padding: 5px 8px; border-bottom: 1px solid rgba(201,169,106,0.3); letter-spacing: 0.06em; }
        .param-table td { padding: 5px 8px; border-bottom: 1px solid rgba(201,169,106,0.1); color: var(--text-secondary); }
        .param-table td:first-child { color: var(--gold-bright); font-family: var(--font-mono); font-size: 11px; }
        .chant-block {
            font-family: var(--font-display);
            font-size: 14px;
            line-height: 1.9;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--gold);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-primary);
            font-style: italic;
        }
        .chant-block.simple {
            border-left: 3px solid var(--purple-bright);
            font-style: normal;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .difficulty-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .diff-chip { padding: 4px 12px; font-size: 11px; border-radius: 14px; letter-spacing: 0.05em; border: 1px solid rgba(201,169,106,0.35); background: rgba(201,169,106,0.05); color: var(--text-secondary); }
        .diff-chip.warning { border-color: rgba(158,59,52,0.5); color: #c46b63; background: rgba(158,59,52,0.08); }
        .diff-chip.safe { border-color: rgba(90,122,74,0.5); color: #8fc47a; background: rgba(90,122,74,0.08); }

        /* ========== 历史弹窗 ========== */
        .history-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center; justify-content: center; padding: 20px;
        }
        .history-modal.open { display: flex; }
        .history-detail {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.4);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 50px rgba(0,0,0,0.6);
        }
        .history-detail .hd-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .history-detail .hd-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--gold-bright);
        }
        .history-detail .hd-close {
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-faint);
            background: none;
            border: none;
            transition: var(--transition);
        }
        .history-detail .hd-close:hover { color: var(--text-primary); background: var(--surface-hover); }
    </style>
</head>
<body>
<div class="page">

    <!-- ========== 输入视图 ========== -->
    <div id="inputView">
        <div class="header">
            <h1>魔法解析器</h1>
            <div class="sub">Magic Parser</div>
        </div>

        <div class="card">
            <div class="input-row">
                <textarea class="magic-input" id="magicInput" placeholder="描述你需要的魔法效果，例如：我想点燃一根火把，火焰要能持续很久..." rows="3"></textarea>
            </div>
            <div class="param-row">
                <div class="param-group">
                    <span class="pg-label">元素</span>
                    <select id="elementSelect">
                        <option value="any">自动判断</option>
                        <option value="fire">火</option>
                        <option value="water">水</option>
                        <option value="wind">风</option>
                        <option value="earth">土</option>
                        <option value="aether">天</option>
                    </select>
                </div>
                <div class="param-group">
                    <span class="pg-label">强度</span>
                    <select id="powerInput">
                        <option value="auto">自动判断</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12+">12+</option>
                    </select>
                </div>
                <div class="param-group">
                    <span class="pg-label">咒语风格</span>
                    <select id="styleSelect">
                        <option value="traditional">传统（教会派）</option>
                        <option value="simple">简易（学院派）</option>
                    </select>
                </div>
                <div style="flex:1;"></div>
                <button class="btn btn-primary" id="parseBtn" onclick="parseMagic()">解析魔法</button>
            </div>

            <!-- 元素简短介绍 -->
            <div class="element-intro">
                <div class="ei-title">五大元素</div>
                <div class="element-grid" id="elementGrid"></div>
            </div>

            <!-- 咒语派系风格 -->
            <div class="style-intro">
                <div class="ei-title">咒语派系</div>
                <div class="style-grid">
                    <div class="style-card traditional">
                        <div class="sc-name">传统 · 教会派</div>
                        <div class="sc-desc">向神祈祷，完整七段结构。咒语悠长但稳定，深受教会与地方魔法师喜爱。</div>
                        <div class="sc-example">"以此物为媒介。伟大的创世神洛丽玛丝啊..."</div>
                    </div>
                    <div class="style-card simple">
                        <div class="sc-name">简易 · 学院派</div>
                        <div class="sc-desc">极简指令，直接下达参数。魔法式更复杂，但施法更快更精确。</div>
                        <div class="sc-example">"火，3尤尺，焰苗。"</div>
                    </div>
                </div>
            </div>

            <!-- 上一次解析 -->
            <div class="history-section" id="historySection">
                <div class="hs-title">上一次解析</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- ========== 解析视图 ========== -->
    <div id="resultView">
        <div class="header" style="margin-bottom:14px;">
            <h1 style="font-size:20px;">魔法解析器</h1>
        </div>

        <div class="result-header">
            <button class="rh-back" onclick="backToInput()">← 返回</button>
            <span class="rh-title">魔法解析</span>
        </div>

        <!-- 思考进度 -->
        <div class="card thinking-box" id="thinkingBox">
            <div class="thinking-stage" id="thinkingStageText">正在解析需求...</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-steps" id="progressSteps">
                <span class="step-dot" data-step="0">解析需求</span>
                <span class="step-dot" data-step="1">匹配元素</span>
                <span class="step-dot" data-step="2">构建魔法式</span>
                <span class="step-dot" data-step="3">生成咒语</span>
                <span class="step-dot" data-step="4">校验规则</span>
            </div>
        </div>

        <!-- 结果内容 -->
        <div class="result-content" id="resultContent">
            <div class="card">
                <div class="result-section">
                    <div class="rs-title">魔法式</div>
                    <div class="formula-block" id="resultFormula"></div>
                </div>
                <div class="result-section">
                    <div class="rs-title">参数解读</div>
                    <table class="param-table" id="resultParams">
                        <thead><tr><th>参数</th><th>含义</th><th>数值</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="result-section">
                    <div class="rs-title">咒语</div>
                    <div class="chant-block" id="resultChant"></div>
                </div>
                <div class="result-section">
                    <div class="rs-title">难度评估</div>
                    <div class="difficulty-row" id="resultDifficulty"></div>
                </div>
                <div class="result-section">
                    <div class="rs-title">风险提示</div>
                    <div class="difficulty-row" id="resultRisk"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 历史弹窗 -->
<div class="history-modal" id="historyModal">
    <div class="history-detail" id="historyDetail"></div>
</div>

<script>
// ========== 数据 ==========
const STORAGE_KEY = 'magic_history';
let historyList = [];

function loadHistory() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) historyList = JSON.parse(raw);
    } catch (e) { historyList = []; }
}
function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(historyList)); } catch (e) {}
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ========== 元素介绍数据 ==========
const ELEMENT_INTROS = [
    { symbol: '△', name: '火', desc: '释放与光热' },
    { symbol: '▽', name: '水', desc: '引导与形态' },
    { symbol: '△̶', name: '风', desc: '传导与感知' },
    { symbol: '▽̶', name: '土', desc: '聚合与坚固' },
    { symbol: '⊕', name: '天', desc: '干涉与解析' }
];

function renderElementIntro() {
    const container = document.getElementById('elementGrid');
    container.innerHTML = ELEMENT_INTROS.map(e =>
        `<div class="element-tag">
            <span class="et-symbol">${e.symbol}</span>
            <span class="et-name">${e.name}</span>
            <span class="et-desc">${e.desc}</span>
        </div>`
    ).join('');
}

// ========== 渲染历史 ==========
function renderHistory() {
    const container = document.getElementById('historyList');
    if (historyList.length === 0) {
        container.innerHTML = '<div class="history-empty">暂无历史解析记录</div>';
        return;
    }
    const last = historyList[0];
    const powerText = last.powerLabel || (typeof last.power === 'number' ? last.power + '级' : last.power);
    container.innerHTML = `
        <div class="history-item" onclick="openHistoryDetail(0)">
            <div class="hi-formula">${esc(last.formula)}</div>
            <div class="hi-time">${esc(last.time)} · ${esc(last.styleName)} · ${esc(last.elementName)} · ${esc(powerText)}</div>
        </div>`;
}

function openHistoryDetail(index) {
    const item = historyList[index];
    if (!item) return;
    const modal = document.getElementById('historyModal');
    const detail = document.getElementById('historyDetail');

    const paramsRows = item.params.map(p =>
        `<tr><td>${esc(p.key)}</td><td>${esc(p.meaning)}</td><td>${esc(p.value)}</td></tr>`
    ).join('');

    const difficultyChips = item.difficulty.map(d =>
        `<span class="diff-chip ${d.type}">${esc(d.text)}</span>`
    ).join('');

    const riskChips = item.risk.map(r =>
        `<span class="diff-chip ${r.type}">${esc(r.text)}</span>`
    ).join('');

    detail.innerHTML = `
        <div class="hd-head">
            <span class="hd-title">上次解析结果</span>
            <button class="hd-close" onclick="closeHistoryDetail()">✕</button>
        </div>
        <div class="result-section">
            <div class="rs-title">魔法式</div>
            <div class="formula-block">${esc(item.formula)}</div>
        </div>
        <div class="result-section">
            <div class="rs-title">参数解读</div>
            <table class="param-table">
                <thead><tr><th>参数</th><th>含义</th><th>数值</th></tr></thead>
                <tbody>${paramsRows}</tbody>
            </table>
        </div>
        <div class="result-section">
            <div class="rs-title">咒语</div>
            <div class="chant-block">${item.chant.replace(/\n/g, '<br>')}</div>
        </div>
        <div class="result-section">
            <div class="rs-title">难度评估</div>
            <div class="difficulty-row">${difficultyChips}</div>
        </div>
        <div class="result-section">
            <div class="rs-title">风险提示</div>
            <div class="difficulty-row">${riskChips}</div>
        </div>`;

    modal.classList.add('open');
}
function closeHistoryDetail() { document.getElementById('historyModal').classList.remove('open'); }

// ========== 示例结果生成 ==========
function generateSampleResult(input, element, power, style) {
    // 新增：检测“附魔”关键词
    if (input.includes('附魔')) {
        return generateEnchantResult(style);
    }

    const elementMap = {
        fire: { symbol: '△', operator: 'Δ', name: '火' },
        water: { symbol: '▽', operator: '∇', name: '水' },
        wind: { symbol: '△̶', operator: '∫', name: '风' },
        earth: { symbol: '▽̶', operator: 'Σ', name: '土' },
        aether: { symbol: '⊕', operator: '∂', name: '天' }
    };

    // 自动判断：默认火
    let elemKey = element === 'any' ? 'fire' : element;
    const elem = elementMap[elemKey];

    // 处理强度
    let actualPower; // 用于计算
    let displayPower; // 用于显示
    if (power === 'auto') {
        actualPower = 3;
        displayPower = '3';
    } else if (power === '12+') {
        actualPower = 12;
        displayPower = '12+';
    } else {
        actualPower = power;
        displayPower = String(power);
    }

    const purity = (actualPower * 1.7 + 3.8).toFixed(1);

    const formula = `↓ ${elem.symbol}${displayPower} ${elem.operator}(pur:${purity}% · form:sphaera · vol:2un³ · spat:5pe · therm:ignis+400gr · temp:1sp · pot:${displayPower} · mut:celeris · iter:linea · celer:rapidus · dir:ante) → sphaera_ignis ↑`;

    let chant = '';
    if (style === 'traditional') {
        chant = '以此物为媒介。伟大的创世神洛丽玛丝啊！\n我将赞颂您的神名，祈求世界的力量。\n我于草木茂盛之地，\n将使用这属于' + elem.name + '之元素的神之赐福，\n在此地5尤尺内燃起焰苗！\n感谢您的慈悲。';
    } else {
        chant = elem.name + '，5尤尺，焰苗。';
    }

    const isOverLimit = actualPower > 11 || power === '12+';

    return {
        formula,
        params: [
            { key: 'pur', meaning: '空流纯度', value: purity + '%' },
            { key: 'form', meaning: '形态', value: '球体' },
            { key: 'vol', meaning: '体积', value: '2立方尤寸' },
            { key: 'spat', meaning: '距离', value: '前方5尤尺' },
            { key: 'temp', meaning: '持续时间', value: '1呼吸' },
            { key: 'pot', meaning: '威力', value: displayPower + '级' },
            { key: 'iter', meaning: '轨迹', value: '直线' },
            { key: 'dir', meaning: '方向', value: '向前' }
        ],
        chant,
        difficulty: [
            { text: '强度 ' + displayPower + ' 级', type: isOverLimit ? 'warning' : 'safe' },
            { text: isOverLimit ? '参数过多，超出常规评级' : '参数数量正常', type: isOverLimit ? 'warning' : 'safe' }
        ],
        risk: isOverLimit
            ? [{ text: '警告：强度超越常规评级上限（11级），实际威力未知', type: 'warning' }]
            : [{ text: '无特别风险', type: 'safe' }]
    };
}

            { text: '三个魔法式需精确同步，否则附魔失效或元素冲突', type: 'warning' },
            { text: '天元素链接若解析失败，可能导致火焰无法触发', type: 'warning' }
        ]
    };
}

// ========== 解析流程 ==========
const THINKING_STEPS = [
    '正在解析需求...',
    '正在匹配元素...',
    '正在构建魔法式...',
    '正在生成咒语...',
    '正在校验规则...'
];
let thinkingTimer = null;

function parseMagic() {
    const input = document.getElementById('magicInput').value.trim();
    if (!input) { document.getElementById('magicInput').focus(); return; }

    // 切换到解析视图
    document.getElementById('inputView').classList.add('hidden');
    document.getElementById('resultView').classList.add('visible');

    // 重置
    document.getElementById('resultContent').classList.remove('visible');
    document.getElementById('thinkingBox').classList.add('visible');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('thinkingStageText').textContent = THINKING_STEPS[0];
    document.querySelectorAll('.step-dot').forEach(s => s.classList.remove('active', 'done'));

    const element = document.getElementById('elementSelect').value;
    const powerRaw = document.getElementById('powerInput').value;
    const power = powerRaw === 'auto' ? 'auto' : (powerRaw === '12+' ? '12+' : parseInt(powerRaw));
    const style = document.getElementById('styleSelect').value;

    let progress = 0;
    let stepIndex = 0;

    thinkingTimer = setInterval(() => {
        progress += 2 + Math.random() * 4;
        if (progress > 100) progress = 100;
        document.getElementById('progressFill').style.width = progress + '%';

        const newStep = Math.floor(progress / 20);
        if (newStep > stepIndex && newStep < THINKING_STEPS.length) {
            stepIndex = newStep;
            document.getElementById('thinkingStageText').textContent = THINKING_STEPS[stepIndex];
            document.querySelectorAll('.step-dot').forEach((s, i) => {
                if (i < stepIndex) s.classList.add('done');
                else if (i === stepIndex) s.classList.add('active');
                else s.classList.remove('active', 'done');
            });
        }

        if (progress >= 100) {
            clearInterval(thinkingTimer);
            document.querySelectorAll('.step-dot').forEach(s => s.classList.add('done'));
            document.getElementById('thinkingStageText').textContent = '解析完成';
            setTimeout(() => {
                showResult(input, element, power, style);
            }, 500);
        }
    }, 80);
}

function showResult(input, element, power, style) {
    document.getElementById('thinkingBox').classList.remove('visible');
    document.getElementById('resultContent').classList.add('visible');

    const result = generateSampleResult(input, element, power, style);
    const styleName = style === 'traditional' ? '传统' : '简易';
    const elementName = element === 'any' ? '自动' : (element === 'fire' ? '火' : element === 'water' ? '水' : element === 'wind' ? '风' : element === 'earth' ? '土' : '天');

    // 魔法式
    const highlighted = result.formula.replace(/(pur|form|vol|spat|therm|temp|pot|mut|iter|celer|dir|anal|target|nod|del|ref|syn|ener|res|stab)/g, '<span class="fb-highlight">$1</span>');
    document.getElementById('resultFormula').innerHTML = highlighted;

    // 参数
    document.querySelector('#resultParams tbody').innerHTML = result.params.map(p =>
        `<tr><td>${esc(p.key)}</td><td>${esc(p.meaning)}</td><td>${esc(p.value)}</td></tr>`
    ).join('');

    // 咒语
    const chantEl = document.getElementById('resultChant');
    chantEl.className = 'chant-block' + (style === 'simple' ? ' simple' : '');
    chantEl.innerHTML = result.chant.replace(/\n/g, '<br>');

    // 难度
    document.getElementById('resultDifficulty').innerHTML = result.difficulty.map(d =>
        `<span class="diff-chip ${d.type}">${esc(d.text)}</span>`
    ).join('');

    // 风险
    document.getElementById('resultRisk').innerHTML = result.risk.map(r =>
        `<span class="diff-chip ${r.type}">${esc(r.text)}</span>`
    ).join('');

    // 计算用于历史显示的强度标签
    let powerLabel;
    if (power === 'auto') {
        powerLabel = '自动判断';
    } else if (power === '12+') {
        powerLabel = '12+级';
    } else {
        powerLabel = power + '级';
    }

    // 保存历史
    const historyItem = {
        formula: result.formula,
        params: result.params,
        chant: result.chant,
        difficulty: result.difficulty,
        risk: result.risk,
        styleName,
        elementName,
        power: power,
        powerLabel: powerLabel,
        time: new Date().toLocaleString('zh-CN', { hour12: false })
    };
    historyList.unshift(historyItem);
    if (historyList.length > 5) historyList.pop();
    saveHistory();
}

function backToInput() {
    clearInterval(thinkingTimer);
    document.getElementById('resultView').classList.remove('visible');
    document.getElementById('inputView').classList.remove('hidden');
    renderHistory();
}

// ========== 快捷键 ==========
document.getElementById('magicInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        parseMagic();
    }
});

// ========== 初始化 ==========
loadHistory();
renderElementIntro();
renderHistory();
</script>
