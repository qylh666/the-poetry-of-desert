<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>势力与阵营 · 三区布局</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1116;
            --surface: #141820;
            --surface-hover: #1b2029;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --red: #9e3b34;
            --purple: #6b4a7a;
            --blue: #3f5f7c;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 20% 110%, rgba(63,95,124,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(201,169,106,0.08) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 1300px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 20px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 10px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        /* ========== 三区布局 ========== */
        .triple-layout {
            display: grid;
            grid-template-columns: 240px 1fr 300px;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 980px) {
            .triple-layout { grid-template-columns: 1fr; }
        }

        /* 通用卡片 */
        .card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 14px 16px;
        }
        .card-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.06em; }

        /* ========== 左侧树形列表 ========== */
        .tree-list { list-style: none; padding: 0; }
        .tree-list li { margin: 0; }
        .tree-node { display: flex; align-items: center; gap: 6px; padding: 7px 8px; cursor: pointer; border-radius: var(--radius); transition: var(--transition); font-size: 13px; color: var(--text-secondary); }
        .tree-node:hover { background: var(--surface-hover); color: var(--text-primary); }
        .tree-node.active { background: rgba(201,169,106,0.1); color: var(--gold-bright); border-left: 2px solid var(--gold); }
        .tree-node .arrow { width: 14px; font-size: 9px; color: var(--gold-dim); transition: transform 0.25s; flex-shrink: 0; text-align: center; }
        .tree-node .arrow.open { transform: rotate(90deg); }
        .tree-node .node-name { flex: 1; }
        .tree-node .node-tier { font-size: 8px; padding: 1px 5px; border: 1px solid rgba(158,59,52,0.5); border-radius: 2px; color: #c46b63; flex-shrink: 0; }
        .tree-children { list-style: none; padding-left: 18px; display: none; }
        .tree-children.open { display: block; }

        /* ========== 中间详情 ========== */
        .detail-section { margin-bottom: 12px; }
        .detail-section .label { font-size: 10px; color: var(--gold-mid); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
        .detail-section .value { font-size: 13px; color: var(--text-primary); line-height: 1.7; }
        .detail-section .value.muted { color: var(--text-secondary); }
        .doctrine-block { padding: 10px 12px; border-left: 3px solid var(--gold-mid); background: rgba(201,169,106,0.05); border-radius: 0 var(--radius) var(--radius) 0; }
        .doctrine-block p { font-style: italic; color: var(--text-secondary); font-size: 12px; line-height: 1.7; margin-bottom: 4px; }
        .member-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; border: 1px solid rgba(201,169,106,0.35); border-radius: 2px; color: var(--text-primary); background: var(--surface-hover); margin: 0 6px 6px 0; }
        .member-chip .mini-avatar { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #fff; }

        /* ========== 右侧关系图 ========== */
        .graph-container { min-height: 400px; display: flex; align-items: center; justify-content: center; position: relative; }
        .graph-container svg { width: 100%; height: auto; display: block; }
        .graph-node { cursor: pointer; }
        .graph-node circle { transition: all 0.3s; }
        .graph-node:hover circle { filter: brightness(1.3); stroke-width: 3; }
        .graph-node text { fill: var(--text-secondary); font-size: 10px; text-anchor: middle; pointer-events: none; }
        .graph-line { transition: all 0.3s; }
        .graph-hint { font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; text-align: center; margin-top: 6px; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>势力与阵营</h1>
        <div class="sub">三区布局 · 树形层级 + 详情 + 关系网</div>
    </div>

    <div class="triple-layout">
        <!-- 左侧：树形列表 -->
        <div class="card">
            <div class="card-title">势力树</div>
            <ul class="tree-list" id="treeList"></ul>
        </div>

        <!-- 中间：详情面板 -->
        <div class="card">
            <div class="card-title" id="detailTitle">势力总览</div>
            <div id="detailBody"></div>
        </div>

        <!-- 右侧：关系图 -->
        <div class="card">
            <div class="card-title">关系网</div>
            <div class="graph-container" id="graphContainer"></div>
            <div class="graph-hint">点击节点跳转 · 线色代表关系类型</div>
        </div>
    </div>
</div>

<script>
// ========== 占位数据 ==========
const factions = [
    {
        id: 'guild', name: '魔法师协会', tier: 'L1', color: '#3f5f7c',
        desc: '由会长安东尼奥领导的独立组织，掌握晶体、传送阵、魔法评级等核心体系。',
        doctrine: ['研究与监管魔法技术。', '不依附于任何国家。'],
        children: [
            { id: 'guild_1', name: '皇家级成员会', tier: 'L2', desc: '法协最高决策层，固定六人。', children: [] },
            { id: 'guild_2', name: '安玛斯特学院', tier: 'L2', desc: '由法协联合晏海城建立的贵族魔法学院。', children: [] }
        ]
    },
    {
        id: 'church', name: '创世神教', tier: 'L1', color: '#9e3b34',
        desc: '以信仰创世神洛丽玛丝为核心，势力遍布大陆。',
        doctrine: ['起初，神行于虚空。', '教会便是神留在人间的权杖。'],
        children: [
            { id: 'church_1', name: '督查司', tier: 'L2', desc: '教皇直属监察情报机构。', children: [] },
            { id: 'church_2', name: '玫瑰十字会', tier: 'L2', desc: '负责传教与基层教区管理。', children: [] },
            { id: 'church_3', name: '圣殿骑士团', tier: 'L2', desc: '负责武装护卫与治安。', children: [] }
        ]
    },
    {
        id: 'alliance', name: '三国联盟', tier: 'L1', color: '#a88955',
        desc: '瑞蒂安、利夫兹、幻沙共同组成的条约框架。',
        children: [
            { id: 'alliance_1', name: '第一区域', tier: 'L2', desc: '教会直辖特区。', children: [] },
            { id: 'alliance_2', name: '第二区域', tier: 'L2', desc: '多种族混合特区。', children: [] }
        ]
    },
    {
        id: 'meher', name: '梅赫尔', tier: 'L2', color: '#6b4a7a',
        desc: '三位旧时代的神统治的异空间组织。',
        doctrine: ['修正是他们的最终目的。'],
        children: []
    },
    {
        id: 'sencity', name: '森之城', tier: 'L2', color: '#5f8f7c',
        desc: '亚人起源地，树长老与各族长者会议决策。',
        children: []
    }
];

// 关系占位
const relations = [
    { from: 'guild', to: 'alliance', type: '合作' },
    { from: 'church', to: 'alliance', type: '合作' },
    { from: 'church', to: 'guild', type: '竞争' },
    { from: 'meher', to: 'church', type: '渗透' },
    { from: 'meher', to: 'guild', type: '渗透' },
    { from: 'sencity', to: 'alliance', type: '中立' },
    { from: 'church', to: 'sencity', type: '中立' }
];

const relationColors = {
    '合作': '#a88955',
    '竞争': '#9e3b34',
    '渗透': '#6b4a7a',
    '中立': '#5f8f7c'
};

// 关联角色占位
const factionMembers = {
    'guild': ['角色A', '角色B', '角色C'],
    'church': ['角色D', '角色E'],
    'meher': ['角色F'],
    'sencity': ['角色G']
};

let selectedId = null;
let expandedIds = new Set(['guild', 'church', 'alliance']);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function findNode(arr, id) {
    for (const n of arr) {
        if (n.id === id) return n;
        if (n.children) { const r = findNode(n.children, id); if (r) return r; }
    }
    return null;
}

function isExpanded(id) { return expandedIds.has(id); }
function toggleExpand(id) {
    if (expandedIds.has(id)) expandedIds.delete(id);
    else expandedIds.add(id);
    renderTree();
}

function renderTree() {
    const treeEl = document.getElementById('treeList');
    function renderNodes(nodes, depth) {
        return nodes.map(n => {
            const hasChildren = n.children && n.children.length > 0;
            const expanded = isExpanded(n.id);
            const active = selectedId === n.id;
            return `
                <li>
                    <div class="tree-node ${active ? 'active' : ''}" style="padding-left:${8 + depth * 14}px;" onclick="selectNode('${n.id}')">
                        ${hasChildren ? `<span class="arrow ${expanded ? 'open' : ''}" onclick="event.stopPropagation(); toggleExpand('${n.id}')">▶</span>` : '<span class="arrow"></span>'}
                        <span class="node-name">${esc(n.name)}</span>
                        ${n.tier ? `<span class="node-tier">${esc(n.tier)}</span>` : ''}
                    </div>
                    ${hasChildren ? `<ul class="tree-children ${expanded ? 'open' : ''}">${renderNodes(n.children, depth + 1)}</ul>` : ''}
                </li>`;
        }).join('');
    }
    treeEl.innerHTML = renderNodes(factions, 0);
}

function selectNode(id) {
    selectedId = id;
    renderTree();
    renderDetail();
    renderGraph();
}

function renderDetail() {
    const node = selectedId ? findNode(factions, selectedId) : null;
    const titleEl = document.getElementById('detailTitle');
    const bodyEl = document.getElementById('detailBody');

    if (!node) {
        titleEl.textContent = '势力总览';
        bodyEl.innerHTML = `
            <div class="detail-section">
                <div class="value muted">点击左侧树形节点查看势力详情。关系网中展示势力之间的合作、竞争、渗透与中立关系。</div>
            </div>
            <div class="detail-section">
                <div class="label">势力数量</div>
                <div class="value">共 ${factions.length} 个主要势力</div>
            </div>`;
        return;
    }

    const members = factionMembers[node.id] || [];
    const memberHTML = members.length
        ? members.map(m => `<span class="member-chip"><span class="mini-avatar" style="background:${node.color || '#8d7f6e'}">${esc(m[0])}</span>${esc(m)}</span>`).join('')
        : '<div class="value muted">暂无收录角色</div>';

    const doctrineHTML = node.doctrine && node.doctrine.length
        ? `<div class="detail-section"><div class="label">教义</div><div class="doctrine-block">${node.doctrine.map(d => `<p>“${esc(d)}”</p>`).join('')}</div></div>`
        : '';

    const childrenHTML = node.children && node.children.length
        ? `<div class="detail-section"><div class="label">下设机构</div><div class="value">${node.children.map(c => esc(c.name)).join('、')}</div></div>`
        : '';

    titleEl.textContent = node.name;
    bodyEl.innerHTML = `
        <div class="detail-section">
            <div class="label">分级</div>
            <div class="value">${esc(node.tier || '未知')}</div>
        </div>
        <div class="detail-section">
            <div class="label">描述</div>
            <div class="value muted">${esc(node.desc || '—')}</div>
        </div>
        ${childrenHTML}
        ${doctrineHTML}
        <div class="detail-section">
            <div class="label">关联角色</div>
            <div>${memberHTML}</div>
        </div>`;
}

function renderGraph() {
    const container = document.getElementById('graphContainer');
    const nodes = factions.filter(f => f.tier === 'L1' || f.id === 'meher' || f.id === 'sencity');
    const nodeIds = new Set(nodes.map(n => n.id));

    // 过滤关系，只保留主要势力之间的关系
    const validRelations = relations.filter(r => nodeIds.has(r.from) && nodeIds.has(r.to));
    const relatedIds = new Set();
    if (selectedId) {
        relatedIds.add(selectedId);
        validRelations.forEach(r => {
            if (r.from === selectedId) relatedIds.add(r.to);
            if (r.to === selectedId) relatedIds.add(r.from);
        });
    }

    const W = 280, H = 380;
    const cx = W / 2, cy = H / 2;
    const radius = 100;

    const positions = {};
    nodes.forEach((n, i) => {
        const angle = (Math.PI * 2 * i) / nodes.length - Math.PI / 2;
        positions[n.id] = {
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius
        };
    });

    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;

    // 画连线
    validRelations.forEach(r => {
        const from = positions[r.from];
        const to = positions[r.to];
        if (!from || !to) return;
        const color = relationColors[r.type] || '#8d7f6e';
        const isHighlighted = selectedId && (r.from === selectedId || r.to === selectedId);
        const isDimmed = selectedId && !isHighlighted;
        svg += `<line class="graph-line" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${color}" stroke-width="${isHighlighted ? 2 : 1}" opacity="${isDimmed ? 0.2 : 0.7}" stroke-dasharray="${r.type === '渗透' ? '4,4' : 'none'}"/>`;
        // 关系标签
        if (!isDimmed) {
            const mx = (from.x + to.x) / 2;
            const my = (from.y + to.y) / 2;
            svg += `<text x="${mx}" y="${my - 4}" fill="${color}" font-size="7" text-anchor="middle">${r.type}</text>`;
        }
    });

    // 画节点
    nodes.forEach(n => {
        const pos = positions[n.id];
        const isRelated = selectedId ? relatedIds.has(n.id) : true;
        const isSelected = selectedId === n.id;
        const radius = isSelected ? 26 : 20;
        const dimmed = selectedId && !isRelated;

        svg += `<g class="graph-node" data-id="${n.id}" onclick="selectNode('${n.id}')" style="opacity:${dimmed ? 0.3 : 1};">
            <circle cx="${pos.x}" cy="${pos.y}" r="${radius}" fill="${n.color}" stroke="${isSelected ? '#e8d5a4' : '#c9a96a'}" stroke-width="${isSelected ? 2.5 : 1.5}"/>
            ${n.id === 'meher' ? `<circle cx="${pos.x}" cy="${pos.y}" r="${radius + 5}" fill="none" stroke="${n.color}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>` : ''}
            <text x="${pos.x}" y="${pos.y + radius + 12}" fill="#a8a091" font-size="9">${esc(n.name.length > 5 ? n.name.slice(0, 5) + '…' : n.name)}</text>
        </g>`;
    });

    svg += '</svg>';
    container.innerHTML = svg;
}

// 初始化
renderTree();
renderDetail();
renderGraph();
</script>
</body>
</html>
