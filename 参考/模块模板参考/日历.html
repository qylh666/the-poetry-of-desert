<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星历 · 尤克特拉日历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e14;
            --surface: #151722;
            --surface-hover: #1b1d2a;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --purple: #6b4a7a;
            --blue: #3f5f7c;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 20% 110%, rgba(107,74,122,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(201,169,106,0.07) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(201,169,106,0.01) 7px, rgba(201,169,106,0.01) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 20px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 10px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        /* 导航行 */
        .cal-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .cal-nav .cn-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-bright);
            letter-spacing: 0.06em;
            min-width: 140px;
        }
        .cal-nav .cn-title .cn-year {
            font-size: 12px;
            color: var(--text-faint);
            letter-spacing: 0.2em;
            margin-left: 6px;
        }
        .cal-nav .spacer { flex: 1; }
        .year-input {
            width: 80px;
            padding: 6px 8px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(201,169,106,0.35);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13px;
            text-align: center;
            outline: none;
            transition: var(--transition);
        }
        .year-input:focus { border-color: rgba(201,169,106,0.7); }
        .btn {
            padding: 8px 14px;
            background: transparent;
            border: 1px solid rgba(201,169,106,0.4);
            border-radius: var(--radius);
            color: var(--gold);
            font-family: var(--font-body);
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); box-shadow: 0 0 15px rgba(201,169,106,0.15); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        .cal-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 860px) { .cal-layout { grid-template-columns: 1fr; } }

        .cal-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 16px 18px;
        }

        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }
        .week-row .week-day {
            text-align: center;
            font-size: 11px;
            color: var(--gold-mid);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 6px 0;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 13px;
            color: var(--text-primary);
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(201,169,106,0.08);
        }
        .day-cell:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.4); }
        .day-cell.empty { background: transparent; border: none; cursor: default; }
        .day-cell.selected {
            background: rgba(201,169,106,0.15);
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(201,169,106,0.2);
        }
        .day-cell.today {
            background: rgba(201,169,106,0.2);
            border-color: var(--gold-bright);
            box-shadow: 0 0 14px rgba(201,169,106,0.3);
            font-weight: 600;
        }
        .day-cell.festival { color: var(--gold-bright); }
        .day-cell.festival::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 6px rgba(201,169,106,0.7);
        }
        .day-cell.has-event::before {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--purple);
        }

        /* 侧边面板 */
        .event-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 16px 18px;
            position: sticky;
            top: 16px;
        }
        .event-card .ec-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .event-card .ec-title .diamond {
            width: 6px;
            height: 6px;
            background: var(--gold);
            transform: rotate(45deg);
            box-shadow: 0 0 8px rgba(201,169,106,0.5);
        }
        .event-list { max-height: 400px; overflow-y: auto; }
        .event-item {
            padding: 8px 10px;
            border-left: 3px solid var(--gold-mid);
            background: rgba(201,169,106,0.04);
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 6px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .event-item:hover { background: rgba(201,169,106,0.08); }
        .event-item .ei-date {
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.1em;
            margin-bottom: 2px;
        }
        .event-item .ei-name {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .event-item .ei-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.5;
        }
        .event-item.festival-event { border-left-color: var(--gold-bright); }
        .event-item.birthday-event { border-left-color: var(--purple); }
        .event-item.custom-event { border-left-color: var(--blue); }
        .event-item .ei-del {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: rgba(158,59,52,0.15);
            border: 1px solid rgba(158,59,52,0.5);
            color: #c46b63;
            font-size: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            font-family: var(--font-body);
        }
        .event-item:hover .ei-del { opacity: 1; }
        .empty-hint { font-size: 11px; color: var(--text-faint); text-align: center; padding: 12px 0; }

        /* 弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 20px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px; padding: 20px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-head { margin-bottom: 14px; }
        .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal label { display: block; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 10px; transition: var(--transition); }
        .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: rgba(201,169,106,0.6); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>星历</h1>
        <div class="sub">尤克特拉日历 · 星陨纪年</div>
    </div>

    <div class="cal-nav">
        <button class="btn btn-sm" onclick="prevMonth()">‹ 上月</button>
        <button class="btn btn-sm" onclick="nextMonth()">下月 ›</button>
        <div class="cn-title">
            <span id="calMonthTitle">1月</span>
            <span class="cn-year">星陨 <input class="year-input" id="yearInput" type="number" min="0" value="2000" onchange="jumpToYear()"> 年</span>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-sm" onclick="goToday()">回到今天</button>
    </div>

    <div class="cal-layout">
        <div class="cal-card">
            <div class="week-row">
                <span class="week-day">一</span>
                <span class="week-day">二</span>
                <span class="week-day">三</span>
                <span class="week-day">四</span>
                <span class="week-day">五</span>
                <span class="week-day">六</span>
                <span class="week-day">日</span>
            </div>
            <div class="day-grid" id="dayGrid"></div>
        </div>

        <div class="event-card">
            <div class="ec-title"><div class="diamond"></div><span id="eventTitle">本月事件</span></div>
            <div style="margin-bottom:10px; display:flex; gap:6px;">
                <button class="btn btn-sm" onclick="addEvent()">＋ 添加事件</button>
            </div>
            <div class="event-list" id="eventList"></div>
        </div>
    </div>
</div>

<!-- 添加事件弹窗 -->
<div class="modal-overlay" id="eventModal" onclick="if(event.target===this)closeEventModal()">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title" id="eventModalTitle">添加事件</div>
            <button class="modal-close" onclick="closeEventModal()">✕</button>
        </div>
        <label>类型</label>
        <select id="eventType">
            <option value="custom">自定义</option>
            <option value="festival">节日</option>
            <option value="birthday">生日</option>
        </select>
        <label>事件名</label>
        <input id="eventName" placeholder="事件名称…">
        <label>描述</label>
        <textarea id="eventDesc" rows="3" placeholder="事件描述…"></textarea>
        <div class="modal-btns">
            <button class="btn btn-sm" onclick="closeEventModal()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="saveEvent()">保存</button>
        </div>
    </div>
</div>

<script>
// ========== 数据 ==========
const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];

// 固定节日数据
let festivalEvents = [
    { id: 'f1', month: 6, day: 25, name: '凯旋日', desc: '大陆最重要的节日，纪念暮色战争结束。三天庆典，全国传送阵免费。', type: 'festival' },
    { id: 'f2', month: 0, day: 1, name: '星陨新年', desc: '星陨纪年的元旦，庆祝陨石坠落后的新生。', type: 'festival' },
    { id: 'f3', month: 6, day: 25, name: '凯旋庆典', desc: '烟火会与丰收祝福。', type: 'festival' }
];

// 生日数据（可自定义）
let birthdayEvents = [
    { id: 'b1', month: 1, day: 31, name: '角色B生日', desc: '创世神教祭司。', type: 'birthday' },
    { id: 'b2', month: 3, day: 25, name: '角色A生日', desc: '魔法师协会成员。', type: 'birthday' }
];

// 自定义事件
let customEvents = [
    { id: 'c1', month: 6, day: 22, name: '写作日', desc: '示例自定义事件。', type: 'custom' }
];

let currentYear = 2000;
let currentMonth;

// 用真实日期初始化
const realToday = new Date();
const realMonth = realToday.getMonth();
const realDay = realToday.getDate();

currentMonth = realMonth;

let selectedDate = null; // { month, day }
let editingEventId = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getAllEvents() {
    return [...festivalEvents, ...birthdayEvents, ...customEvents];
}

function getEventsForDate(month, day) {
    return getAllEvents().filter(e => e.month === month && e.day === day);
}

function getEventsForMonth(month) {
    return getAllEvents().filter(e => e.month === month).sort((a, b) => a.day - b.day);
}

function isToday(month, day) {
    return month === realMonth && day === realDay;
}

function renderCalendar() {
    document.getElementById('calMonthTitle').textContent = months[currentMonth];
    document.getElementById('yearInput').value = currentYear;

    const days = monthDays[currentMonth];
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const firstDayMon = (firstDay + 6) % 7;

    let html = '';
    for (let i = 0; i < firstDayMon; i++) {
        html += '<div class="day-cell empty"></div>';
    }
    for (let d = 1; d <= days; d++) {
        const evts = getEventsForDate(currentMonth, d);
        const isFestival = evts.some(e => e.type === 'festival');
        const isTodayCell = isToday(currentMonth, d);
        const isSelected = selectedDate && selectedDate.month === currentMonth && selectedDate.day === d;
        html += `<div class="day-cell ${isFestival ? 'festival' : ''} ${evts.length && !isFestival ? 'has-event' : ''} ${isTodayCell ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate(${d})">${d}</div>`;
    }
    document.getElementById('dayGrid').innerHTML = html;

    // 渲染事件列表
    if (selectedDate && selectedDate.month === currentMonth) {
        renderDateEvents(selectedDate.day);
    } else {
        renderMonthEvents();
    }
}

function selectDate(day) {
    selectedDate = { month: currentMonth, day };
    renderCalendar();
}

function renderMonthEvents() {
    const evts = getEventsForMonth(currentMonth);
    document.getElementById('eventTitle').textContent = `${months[currentMonth]}事件`;
    renderEventList(evts);
}

function renderDateEvents(day) {
    const evts = getEventsForDate(currentMonth, day);
    document.getElementById('eventTitle').textContent = `${months[currentMonth]}${day}日事件`;
    renderEventList(evts);
}

function renderEventList(evts) {
    document.getElementById('eventList').innerHTML = evts.length ? evts.map(e => `
        <div class="event-item ${e.type === 'festival' ? 'festival-event' : e.type === 'birthday' ? 'birthday-event' : 'custom-event'}">
            <div class="ei-date">${months[e.month]}${e.day}日</div>
            <div class="ei-name">${esc(e.name)}</div>
            <div class="ei-desc">${esc(e.desc)}</div>
            <button class="ei-del" onclick="deleteEvent('${e.id}')" title="删除">✕</button>
        </div>`).join('') : '<div class="empty-hint">这一天没有特殊事件</div>';
}

function prevMonth() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
}
function nextMonth() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
}
function jumpToYear() {
    const y = parseInt(document.getElementById('yearInput').value);
    if (!isNaN(y) && y >= 0) {
        currentYear = y;
        renderCalendar();
    }
}
function goToday() {
    currentYear = 2000;
    currentMonth = realMonth;
    selectedDate = { month: realMonth, day: realDay };
    renderCalendar();
}

// ========== 事件编辑 ==========
function addEvent() {
    editingEventId = null;
    document.getElementById('eventModalTitle').textContent = '添加事件';
    document.getElementById('eventType').value = 'custom';
    document.getElementById('eventName').value = '';
    document.getElementById('eventDesc').value = '';
    document.getElementById('eventModal').classList.add('open');
}

function closeEventModal() {
    document.getElementById('eventModal').classList.remove('open');
}

function saveEvent() {
    const type = document.getElementById('eventType').value;
    const name = document.getElementById('eventName').value.trim();
    const desc = document.getElementById('eventDesc').value.trim();
    if (!name) return;

    const month = selectedDate ? selectedDate.month : currentMonth;
    const day = selectedDate ? selectedDate.day : 1;

    const event = {
        id: 'e' + Date.now(),
        month,
        day,
        name,
        desc: desc || '—',
        type
    };

    if (type === 'festival') {
        festivalEvents.push(event);
    } else if (type === 'birthday') {
        birthdayEvents.push(event);
    } else {
        customEvents.push(event);
    }

    closeEventModal();
    renderCalendar();
}

function deleteEvent(id) {
    festivalEvents = festivalEvents.filter(e => e.id !== id);
    birthdayEvents = birthdayEvents.filter(e => e.id !== id);
    customEvents = customEvents.filter(e => e.id !== id);
    renderCalendar();
}

// 初始化
renderCalendar();
</script>
</body>
</html>
