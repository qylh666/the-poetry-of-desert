<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日人品</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1116;
            --surface: #181b21;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --wax: #8b1a1a;
            --wax-dark: #5c0e0e;
            --wax-light: #b83535;
            --paper: #e8dcc8;
            --paper-dark: #d4c8b0;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 24px 28px 50px;
            background-image:
                radial-gradient(circle at 30% 110%, rgba(201,169,106,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(158,59,52,0.04) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px);
            pointer-events: none; z-index: 0;
        }
        .page { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 18px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 9px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        .main-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            margin-bottom: 14px;
        }

        .date-row {
            text-align: center;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.15em;
        }
        .date-row .dr-label { display: block; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 4px; }
        .date-row .dr-value {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--gold);
        }

        .hint-text {
            text-align: center;
            font-size: 12px;
            color: var(--gold-mid);
            letter-spacing: 0.08em;
            margin-bottom: 14px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .hint-text.visible { opacity: 1; }

        .paper-stage {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== 信封 ========== */
        .envelope {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 170px;
            z-index: 2;
            cursor: pointer;
        }

        /* 信封主体：矩形，顶边在 0 */
        .env-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 170px;
            background: linear-gradient(135deg, var(--paper), var(--paper-dark));
            border-radius: 2px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            z-index: 1;
        }

        /* 三角封盖：底边在信封顶边，顶点向下 */
        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            z-index: 3;
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            background: linear-gradient(180deg, var(--paper) 10%, #c8b89c 60%, #b8a888 100%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            transform-origin: top center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 火漆印：盖在三角顶点，不绑定单独的点击事件 */
        .wax-seal {
            position: absolute;
            top: 77px;
            left: 50%;
            transform: translateX(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, var(--wax-light), var(--wax) 55%, var(--wax-dark) 100%);
            box-shadow:
                0 3px 10px rgba(0,0,0,0.4),
                inset 0 1px 3px rgba(255,255,255,0.2),
                0 0 0 3px rgba(139,26,26,0.3);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .wax-seal .ws-symbol {
            font-size: 17px;
            color: rgba(255,220,180,0.85);
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        .wax-seal .ws-inner-ring {
            position: absolute;
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,220,180,0.3);
        }
        .wax-seal.removed {
            opacity: 0;
        }

        .envelope.flap-open .env-flap {
            transform: rotateX(60deg);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .envelope.burning {
            animation: envelopeBurnUp 1.1s ease-in forwards;
        }
        @keyframes envelopeBurnUp {
            0% { clip-path: inset(0 0 0 0); opacity: 1; }
            35% { clip-path: inset(20% 0 0 0); opacity: 1; }
            70% { clip-path: inset(55% 0 0 0); opacity: 0.8; }
            100% { clip-path: inset(100% 0 0 0); opacity: 0; }
        }
        .envelope.burnt {
            clip-path: inset(100% 0 0 0);
            opacity: 0;
            pointer-events: none;
        }

        /* ========== 火焰 emoji ========== */
        .flames {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 220px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .flames.active { opacity: 1; }
        .flame-emoji {
            position: absolute;
            bottom: 0;
            animation: flameRise 0.9s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 12px rgba(255,140,0,0.65));
        }
        .flame-emoji:nth-child(1) { left: 6%; font-size: 48px; animation-delay: 0s; }
        .flame-emoji:nth-child(2) { left: 27%; font-size: 36px; animation-delay: 0.14s; }
        .flame-emoji:nth-child(3) { left: 48%; font-size: 62px; animation-delay: 0.07s; }
        .flame-emoji:nth-child(4) { left: 68%; font-size: 40px; animation-delay: 0.19s; }
        .flame-emoji:nth-child(5) { left: 87%; font-size: 52px; animation-delay: 0.04s; }

        @keyframes flameRise {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-40px) scale(1.22); }
        }

        /* ========== 结果浮现 ========== */
        .result-reveal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 7;
            opacity: 0;
            transition: opacity 0.5s ease 0.5s;
        }
        .result-reveal.visible { opacity: 1; }
        .result-reveal .rr-number {
            font-family: var(--font-display);
            font-size: 52px;
            font-weight: 700;
            color: var(--gold-bright);
            text-shadow: 0 0 30px rgba(201,169,106,0.6);
            line-height: 1;
            margin-bottom: 4px;
        }
        .result-reveal .rr-label {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* ========== 胡音评价区 ========== */
        .verdict-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-top: 16px;
            opacity: 0;
            transition: opacity 0.5s ease 0.8s;
        }
        .verdict-row.visible { opacity: 1; }

        .character-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(201,169,106,0.25);
        }

        .bubble-wrap { flex: 1; min-width: 0; }
        .speech-bubble {
            position: relative;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(201,169,106,0.25);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.7;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 14px;
            width: 12px;
            height: 12px;
            background: rgba(0,0,0,0.4);
            border-left: 1px solid rgba(201,169,106,0.25);
            border-bottom: 1px solid rgba(201,169,106,0.25);
            transform: rotate(45deg);
        }
        .speech-bubble .sb-speaker {
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.1em;
            margin-bottom: 2px;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }
        .btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--gold-mid), var(--gold));
            border: 1px solid var(--gold-bright);
            border-radius: var(--radius);
            color: #1a1512;
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: var(--transition);
        }
        .btn:hover { box-shadow: 0 0 25px rgba(201,169,106,0.4); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>今日人品</h1>
        <div class="sub">Daily Fortune · 胡音的评价</div>
    </div>

    <div class="main-card">
        <div class="date-row">
            <span class="dr-label">Today's Fortune</span>
            <span class="dr-value" id="dateDisplay"></span>
        </div>

        <div class="hint-text" id="hintText">点击信封，查看你的今日人品。</div>

        <div class="paper-stage" id="paperStage">
            <div class="flames" id="flames">
                <span class="flame-emoji">🔥</span>
                <span class="flame-emoji">🔥</span>
                <span class="flame-emoji">🔥</span>
                <span class="flame-emoji">🔥</span>
                <span class="flame-emoji">🔥</span>
            </div>
            <div class="envelope" id="envelope" onclick="burnEnvelope()">
                <div class="env-body"></div>
                <div class="env-flap"></div>
                <div class="wax-seal" id="waxSeal">
                    <span class="ws-inner-ring"></span>
                    <span class="ws-symbol">❖</span>
                </div>
            </div>
            <div class="result-reveal" id="resultReveal">
                <div class="rr-number" id="rrNumber">—</div>
                <div class="rr-label">今日人品</div>
            </div>
        </div>

        <div class="verdict-row" id="verdictRow">
            <div class="character-avatar" id="charAvatar">胡</div>
            <div class="bubble-wrap">
                <div class="speech-bubble">
                    <div class="sb-speaker">胡音</div>
                    <span id="verdictText"></span>
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn" id="relightBtn" onclick="relightEnvelope()">✉ 重新点燃</button>
        </div>
    </div>
</div>

<script>
const VERDICTS = [
    { min: 99, max: 100, texts: [
        '虚心接受吧，来自加百列大人的恩赐。',
        '……加百列大人很少给这种评价。',
        '……你最好别得意太久。'
    ] },
    { min: 91, max: 98, texts: [
        '......略微对你刮目相看了。',
        '今天倒是有那么一点可取之处。',
        '还算没辜负加百列大人的期待。'
    ] },
    { min: 71, max: 90, texts: [
        '你应该为此感到光荣才是。',
        '这样的结果，可以出去见人了。',
        '普普通通……好吧，其实还行。'
    ] },
    { min: 41, max: 70, texts: [
        '这代表你不够努力。',
        '一般。',
        '没什么好得意的，也没什么好说的。',
        '勉强及格，别让我再看到你偷懒。'
    ] },
    { min: 11, max: 40, texts: [
        '真是差劲。',
        '加百列大人看了说不定会叹气。不，大概会笑吧。',
        '你今天是不是把运气落在床上了？',
        '这么低的分，我都替你难堪。'
    ] },
    { min: 0, max: 10, texts: [
        '我看了都想笑。',
        '……这不是人品问题，这是能力问题。',
        '建议你今天离我远一点，也离加百列大人远一点。',
        '再掷一次？算了吧，我怕你会把信纸也烧没了。'
    ] }
];

let burning = false;
let burnt = false;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function updateDate() {
    const now = new Date();
    const weekdays = ['日','一','二','三','四','五','六'];
    const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · 星期${weekdays[now.getDay()]}`;
    document.getElementById('dateDisplay').textContent = dateStr;
}

function getVerdict(score) {
    const group = VERDICTS.find(v => score >= v.min && score <= v.max);
    if (!group) return '……';
    return group.texts[Math.floor(Math.random() * group.texts.length)];
}

function burnEnvelope() {
    if (burning || burnt) return;
    burning = true;

    const envelope = document.getElementById('envelope');
    const waxSeal = document.getElementById('waxSeal');
    const flames = document.getElementById('flames');
    const resultReveal = document.getElementById('resultReveal');
    const verdictRow = document.getElementById('verdictRow');
    const hintText = document.getElementById('hintText');
    const relightBtn = document.getElementById('relightBtn');

    resultReveal.classList.remove('visible');
    verdictRow.classList.remove('visible');
    hintText.classList.remove('visible');

    const score = Math.floor(Math.random() * 101);

    // 1. 火漆印先消失
    waxSeal.classList.add('removed');

    // 2. 三角掀开
    setTimeout(() => {
        envelope.classList.add('flap-open');
    }, 300);

    // 3. 火焰升起
    setTimeout(() => {
        flames.classList.add('active');
    }, 500);

    // 4. 信封从底部烧毁
    setTimeout(() => {
        envelope.classList.add('burning');
    }, 700);

    // 5. 结果显示
    setTimeout(() => {
        flames.classList.remove('active');
        envelope.classList.remove('burning');
        envelope.classList.add('burnt');
        document.getElementById('rrNumber').textContent = score;
        document.getElementById('verdictText').textContent = getVerdict(score);
        resultReveal.classList.add('visible');
        verdictRow.classList.add('visible');
        burning = false;
        relightBtn.disabled = false;
    }, 2000);
}

function relightEnvelope() {
    if (burning) return;
    const envelope = document.getElementById('envelope');
    const waxSeal = document.getElementById('waxSeal');
    const resultReveal = document.getElementById('resultReveal');
    const verdictRow = document.getElementById('verdictRow');
    const flames = document.getElementById('flames');
    const hintText = document.getElementById('hintText');
    const relightBtn = document.getElementById('relightBtn');

    resultReveal.classList.remove('visible');
    verdictRow.classList.remove('visible');
    flames.classList.remove('active');
    document.getElementById('rrNumber').textContent = '—';
    envelope.classList.remove('burnt');
    envelope.classList.remove('flap-open');
    waxSeal.classList.remove('removed');

    setTimeout(() => {
        hintText.classList.add('visible');
    }, 300);

    burnt = false;
    burning = false;
    relightBtn.disabled = true;
}

updateDate();
relightEnvelope();
</script>
</body>
</html>
