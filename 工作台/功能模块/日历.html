<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星历 · 尤克特拉日历 · 沙漠之歌工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e14;
            --bg-elevated: #14171e;
            --surface: #151722;
            --surface-hover: #1b1d2a;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --purple: #6b4a7a;
            --blue: #3f5f7c;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 110%, rgba(107,74,122,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(201,169,106,0.07) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(201,169,106,0.01) 7px, rgba(201,169,106,0.01) 8px);
            pointer-events: none; z-index: 0;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 210px;
            min-height: 100vh;
            background: rgba(20, 23, 30, 0.97);
            border-right: 2px solid transparent;
            border-image: linear-gradient(180deg, transparent 0%, rgba(201,169,106,0.5) 20%, rgba(201,169,106,0.5) 80%, transparent 100%) 1;
            position: sticky;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            backdrop-filter: blur(20px);
        }
        .sidebar-brand { text-align: center; padding: 24px 18px 18px; position: relative; margin-bottom: 6px; }
        .sidebar-brand::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 65%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .sidebar-brand h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.08em; text-shadow: 0 0 30px rgba(201,169,106,0.4); }
        .sidebar-brand span { font-size: 9px; color: var(--gold-dim); letter-spacing: 0.5em; text-transform: uppercase; display: block; margin-top: 5px; }
        .sidebar-section { font-size: 10px; color: var(--gold-mid); letter-spacing: 0.28em; text-transform: uppercase; padding: 16px 22px 8px; display: flex; align-items: center; gap: 8px; }
        .sidebar-section::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,169,106,0.4), transparent); }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin: 1px 0; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 9px 22px; color: var(--text-secondary); font-size: 13px; text-decoration: none; letter-spacing: 0.04em; border-left: 2px solid transparent; transition: var(--transition); }
        .sidebar-nav a:hover { color: var(--text-primary); background: rgba(201,169,106,0.04); }
        .sidebar-nav a.active { color: var(--gold-bright); border-left-color: var(--gold); background: rgba(201,169,106,0.06); }
        .sidebar-nav .nav-num { font-family: var(--font-display); font-size: 11px; color: var(--gold-dim); width: 16px; text-align: center; flex-shrink: 0; }
        .sidebar-nav a.nav-toggle { cursor: pointer; user-select: none; }
        .sidebar-nav a.nav-toggle.open { color: var(--gold-mid); }
        .sidebar-nav .nav-arrow { margin-left: auto; font-size: 9px; color: var(--gold-dim); transition: transform var(--transition); flex-shrink: 0; }
        .sidebar-nav a.nav-toggle.open .nav-arrow { transform: rotate(90deg); }
        .nav-sub { list-style: none; padding: 0; display: none; }
        .nav-sub.open { display: block; }
        .nav-sub a { padding: 7px 22px 7px 46px; font-size: 12px; font-weight: 300; color: var(--text-faint); letter-spacing: 0.05em; }
        .nav-sub a:hover { color: var(--text-primary); background: rgba(201,169,106,0.04); }
        .nav-sub a.active { color: var(--gold-bright); border-left-color: var(--gold); background: rgba(201,169,106,0.06); }
        .nav-sub .nav-dot { width: 4px; height: 4px; background: var(--gold-dim); transform: rotate(45deg); flex-shrink: 0; transition: var(--transition); }
        .nav-sub a.active .nav-dot { background: var(--gold); box-shadow: 0 0 6px rgba(201,169,106,0.7); }
        .sidebar-footer { margin-top: auto; padding: 14px 22px 18px; font-size: 10px; color: var(--text-faint); letter-spacing: 0.15em; text-align: center; border-top: 1px solid rgba(201,169,106,0.2); position: relative; }
        .sidebar-footer::before { content: '❖'; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); color: var(--gold-dim); font-size: 9px; background: var(--bg-elevated); padding: 0 8px; }

        /* ========== 主区域 ========== */
        .main { flex: 1; position: relative; z-index: 5; padding: 28px 36px 50px; min-width: 0; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; margin-bottom: 22px; position: relative; }
        .topbar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, rgba(201,169,106,0.9) 0%, rgba(201,169,106,0.5) 20%, rgba(201,169,106,0.15) 50%, rgba(201,169,106,0.5) 80%, rgba(201,169,106,0.9) 100%); }
        .topbar::before { content: '❖'; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 11px; text-shadow: 0 0 15px rgba(201,169,106,0.8); background: var(--bg); padding: 0 10px; z-index: 2; }
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-faint); letter-spacing: 0.08em; }
        .breadcrumb .separator { color: var(--gold-dim); font-size: 9px; }
        .breadcrumb .current { color: var(--gold); }
        .topbar-status { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--text-faint); letter-spacing: 0.1em; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgba(201,169,106,0.8); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(201,169,106,0.8); } 50% { opacity: 0.4; box-shadow: 0 0 4px rgba(201,169,106,0.3); } }

        .page { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 20px; position: relative; padding-bottom: 14px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.3); }
        .header .sub { font-size: 10px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4px; }

        /* ========== 导航行 ========== */
        .cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .cal-nav .cn-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--gold-bright); letter-spacing: 0.06em; min-width: 150px; }
        .cal-nav .cn-title .cn-year { font-size: 12px; color: var(--text-faint); letter-spacing: 0.2em; margin-left: 6px; }
        .cal-nav .spacer { flex: 1; }
        .year-input { width: 80px; padding: 6px 8px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.35); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; text-align: center; outline: none; transition: var(--transition); }
        .year-input:focus { border-color: rgba(201,169,106,0.7); }
        .btn { padding: 8px 14px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: var(--radius); color: var(--gold); font-family: var(--font-body); font-size: 12px; cursor: pointer; letter-spacing: 0.06em; transition: var(--transition); white-space: nowrap; }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); box-shadow: 0 0 15px rgba(201,169,106,0.15); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        .cal-layout { display: grid; grid-template-columns: 1fr 280px; gap: 18px; align-items: start; }
        @media (max-width: 860px) { .cal-layout { grid-template-columns: 1fr; } }
        .cal-card { background: var(--surface); border: 1px solid rgba(201,169,106,0.2); outline: 1px solid rgba(201,169,106,0.06); outline-offset: 4px; border-radius: var(--radius); padding: 16px 18px; }

        .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
        .week-row .week-day { text-align: center; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 0; }

        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 13px;
            color: var(--text-primary);
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(201,169,106,0.08);
        }
        .day-cell:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.4); }
        .day-cell.empty { background: transparent; border: none; cursor: default; }
        .day-cell.selected { background: rgba(201,169,106,0.15); border-color: var(--gold); box-shadow: 0 0 10px rgba(201,169,106,0.2); }
        .day-cell.today { background: rgba(201,169,106,0.2); border-color: var(--gold-bright); box-shadow: 0 0 14px rgba(201,169,106,0.3); font-weight: 600; }
        .day-cell.festival { color: var(--gold-bright); }
        .day-cell.festival::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px rgba(201,169,106,0.7); }
        .day-cell.has-event::before { content: ''; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--purple); }

        /* ========== 事件面板 ========== */
        .event-card { background: var(--surface); border: 1px solid rgba(201,169,106,0.2); outline: 1px solid rgba(201,169,106,0.06); outline-offset: 4px; border-radius: var(--radius); padding: 16px 18px; position: sticky; top: 16px; }
        .event-card .ec-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--gold); margin-bottom: 10px; letter-spacing: 0.06em; display: flex; align-items: center; gap: 8px; }
        .event-card .ec-title .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px rgba(201,169,106,0.5); }
        .event-list { max-height: 420px; overflow-y: auto; }
        .event-item { padding: 8px 10px; border-left: 3px solid var(--gold-mid); background: rgba(201,169,106,0.04); border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 6px; cursor: pointer; transition: var(--transition); position: relative; }
        .event-item:hover { background: rgba(201,169,106,0.08); }
        .event-item .ei-date { font-size: 10px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 2px; }
        .event-item .ei-name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
        .event-item .ei-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }
        .event-item .ei-fixed { font-size: 9px; color: var(--text-faint); border: 1px solid rgba(201,169,106,0.2); border-radius: 2px; padding: 0 4px; margin-left: 6px; letter-spacing: 0.1em; }
        .event-item.festival-event { border-left-color: var(--gold-bright); }
        .event-item.birthday-event { border-left-color: var(--purple); }
        .event-item.custom-event { border-left-color: var(--blue); }
        .event-item .ei-del { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 4px; background: rgba(158,59,52,0.15); border: 1px solid rgba(158,59,52,0.5); color: #c46b63; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-family: var(--font-body); }
        .event-item:hover .ei-del { opacity: 1; }
        .empty-hint { font-size: 11px; color: var(--text-faint); text-align: center; padding: 12px 0; }

        /* ========== 弹窗 ========== */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 20px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px; padding: 20px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-head { margin-bottom: 14px; }
        .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal label { display: block; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 10px; transition: var(--transition); }
        .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: rgba(201,169,106,0.6); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { padding: 20px 16px; }
            .topbar-status { display: none; }
            .header h1 { font-size: 24px; }
        }
        /* ========== 侧边栏折叠 ========== */
        .sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { width: 56px; }
        .sidebar.collapsed .sidebar-brand h1,
        .sidebar.collapsed .sidebar-brand span,
        .sidebar.collapsed .sidebar-section,
        .sidebar.collapsed .sidebar-nav,
        .sidebar.collapsed .sidebar-footer { display: none; }
        .sidebar.collapsed .sidebar-brand { padding: 24px 0 18px; }
        .sidebar.collapsed .sidebar-brand::before {
            content: '沙';
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-bright);
            display: block;
            text-align: center;
            text-shadow: 0 0 20px rgba(201,169,106,0.4);
        }
        .sb-toggle {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid rgba(201,169,106,0.35);
            color: var(--gold-mid);
            font-size: 9px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            font-family: var(--font-body);
            z-index: 2;
        }
        .sb-toggle:hover { color: var(--gold-bright); border-color: var(--gold); background: rgba(201,169,106,0.1); }
        .sidebar.collapsed .sb-toggle { right: 17px; }
        .sidebar.collapsed .sb-toggle:hover { background: rgba(201,169,106,0.15); }

        /* ========== 侧边栏收起：按钮 + 竖向标题 ========== */
        .sb-brand-v {
            display: none;
            writing-mode: vertical-rl;
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.4em;
            line-height: 1.4;
            color: var(--gold-bright);
            text-shadow: 0 0 16px rgba(201,169,106,0.35);
        }
        .sidebar.collapsed .sb-brand-v { display: block; order: 1; }
        .sidebar.collapsed .sidebar-brand::before { content: none; }
        .sidebar.collapsed .sidebar-brand {
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .sidebar.collapsed .sb-toggle { position: static; transform: none; order: 0; }
        .sidebar-brand span {
            font-size: 7px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        /* ========== 亮色主题（白 + 宝蓝，参考 亮色工作台.html） ========== */
        body.light {
            --bg: #f5f8fc;
            --bg-elevated: #ffffff;
            --surface: #ffffff;
            --surface-hover: #f0f4fa;
            --gold: #1e40af;
            --gold-bright: #2563eb;
            --gold-mid: #3b82f6;
            --gold-dim: #93b4f5;
            --red: #c0392b;
            --purple: #5a6fa8;
            --blue: #2563eb;
            --text-primary: #1a2538;
            --text-secondary: #4a5870;
            --text-faint: #8a95a8;
            --line: rgba(30, 64, 175, 0.18);
        }
        body.light {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(30, 64, 175, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 50% 110%, rgba(37, 99, 235, 0.04) 0%, transparent 40%);
        }
        body.light::before {
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(30, 64, 175, 0.015) 7px, rgba(30, 64, 175, 0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(30, 64, 175, 0.01) 7px, rgba(30, 64, 175, 0.01) 8px);
        }
        .theme-toggle {
            margin: 12px 16px 6px;
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            flex-shrink: 0;
            background: var(--surface);
        }
        .theme-toggle:hover { background: var(--surface-hover); color: var(--gold); border-color: var(--gold); }
        .theme-toggle .tt-icon { font-size: 13px; }
        .theme-toggle .tt-text { letter-spacing: 0.1em; }
        .sidebar.collapsed .theme-toggle { display: none; }
        .mc-theme {
            position: absolute;
            top: 12px; right: 12px;
            width: 26px; height: 26px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--surface-hover);
            color: var(--gold-mid);
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            z-index: 3;
        }
        .mc-theme {
            position: static;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }
        .mc-theme:hover { color: var(--gold); border-color: var(--gold); background: var(--surface-hover); }
        .mc-theme .tt-icon { font-size: 13px; }
        .mc-theme .tt-text { letter-spacing: 0.1em; }
        /* 亮色去金化：圆角对齐模板，容器/输入/按钮边框统一为宝蓝线条 */
        body.light { --radius: 6px; }
        body.light .card,
        body.light .frame-card,
        body.light .todo-card,
        body.light .mini-cal,
        body.light .modal,
        body.light .event-card,
        body.light .cal-card,
        body.light .char-card,
        body.light .term-card,
        body.light .bubble,
        body.light .notice,
        body.light .pt-card,
        body.light .info-card,
        body.light .map-card,
        body.light .input,
        body.light .search-input,
        body.light .year-input,
        body.light .todo-input,
        body.light .comment-input,
        body.light .feed-input,
        body.light .chat-input,
        body.light .pt-input,
        body.light .modal input,
        body.light .modal textarea,
        body.light .modal select,
        body.light .field .input,
        body.light .relcanvas { border-color: var(--line); }
        body.light .btn,
        body.light .chip,
        body.light .tag,
        body.light .tag-user,
        body.light .meta-chip,
        body.light .member-chip,
        body.light .sub-node-chip,
        body.light .tl-tag { border-color: var(--line); }
        body.light .btn:hover,
        body.light .chip:hover,
        body.light .meta-chip:hover { border-color: var(--gold); background: var(--surface-hover); }
        body.light input:focus,
        body.light textarea:focus,
        body.light select:focus { border-color: var(--gold-bright); }
        body.light .card,
        body.light .frame-card,
        body.light .todo-card,
        body.light .mini-cal,
        body.light .modal,
        body.light .char-card,
        body.light .term-card,
        body.light .bubble { box-shadow: 0 2px 12px rgba(30, 64, 175, 0.08); }
        /* ========== 亮色补全：去黑去金 ========== */
        body.light .input,
        body.light .search-input,
        body.light .year-input,
        body.light .todo-input,
        body.light .comment-input,
        body.light .feed-input,
        body.light .chat-input,
        body.light .pt-input,
        body.light .modal input,
        body.light .modal textarea,
        body.light .modal select,
        body.light .field .input { background: var(--bg); color: var(--text-primary); }
        body.light .day-cell { background: var(--surface-hover); border-color: var(--line); }
        body.light .relcanvas { background: var(--surface-hover); }
        body.light .frame-card,
        body.light .card,
        body.light .todo-card,
        body.light .mini-cal,
        body.light .modal,
        body.light .char-card,
        body.light .term-card,
        body.light .bubble,
        body.light .event-card,
        body.light .cal-card,
        body.light .info-card { outline: 1px solid var(--line); outline-offset: 3px; }
        body.light .topbar::after {
            background: linear-gradient(90deg, var(--gold) 0%, rgba(30,64,175,0.5) 20%, rgba(30,64,175,0.15) 50%, rgba(30,64,175,0.5) 80%, var(--gold) 100%);
        }
        body.light .sidebar { background: var(--bg-elevated); border-image: linear-gradient(180deg, transparent 0%, rgba(30,64,175,0.5) 20%, rgba(30,64,175,0.5) 80%, transparent 100%) 1; }
        body.light .status-dot { box-shadow: 0 0 12px rgba(37,99,235,0.5); animation: pulseLight 2s infinite; }
        /* ========== 亮色统一补丁 ========== */
        body.light .header h1,
        body.light .page-heading h2 { color: var(--gold); }
        body.light .page-heading h2 { text-shadow: none; }
        body.light .mc-chip { border-color: var(--line); background: var(--surface-hover); }
        .theme-toggle, .mc-theme { white-space: nowrap; }
        body.light .delbar { background: var(--surface); }
        /* ========== 侧边栏固定视口高度 + 主题滚动条 ========== */
        .sidebar { height: 100vh; min-height: 100vh; overflow-y: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-mid); }
        * { scrollbar-width: thin; scrollbar-color: var(--gold-dim) transparent; }
        @keyframes pulseLight {
            0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(37,99,235,0.5); }
            50% { opacity: 0.4; box-shadow: 0 0 4px rgba(37,99,235,0.15); }
        }
    </style>
</head>
<body>

    <!-- ========== 无 Spherse 环境降级层（localStorage 编辑 + 导出/导入） ========== -->
    <script src="../../forum/standalone.js"></script>

    <!-- ========== 侧边栏 ========== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>沙漠之歌</h1>
            <span>The Poetry of Desert</span>
            <div class="sb-brand-v">沙漠之歌·导航栏</div>
            <button class="sb-toggle" onclick="toggleSidebar()" title="折叠/展开侧边栏">❮</button>
        </div>
        <div class="sidebar-section">导航</div>
        <ul class="sidebar-nav">
            <li><a href="../开始页.html"><span class="nav-num">I</span>欢迎</a></li>
            <li>
                <a href="#" class="nav-toggle open" onclick="toggleNav(event, this)"><span class="nav-num">II</span>功能模块<span class="nav-arrow">▸</span></a>
                <ul class="nav-sub open">
                    <li><a href="酒馆.html"><span class="nav-dot"></span>酒馆</a></li>
                    <li><a href="日历.html" class="active"><span class="nav-dot"></span>日历</a></li>
                </ul>
            </li>
            <li>
                <a href="#" class="nav-toggle" onclick="toggleNav(event, this)"><span class="nav-num">III</span>设定资料<span class="nav-arrow">▸</span></a>
                <ul class="nav-sub">
                    <li><a href="../设定资料/势力与阵营.html"><span class="nav-dot"></span>势力与阵营</a></li>
                    <li><a href="../设定资料/历史事件.html"><span class="nav-dot"></span>历史事件</a></li>
                    <li><a href="../设定资料/地理总览.html"><span class="nav-dot"></span>地理总览</a></li>
                    <li><a href="../设定资料/术语库.html"><span class="nav-dot"></span>术语库</a></li>
                    <li><a href="../设定资料/角色档案库.html"><span class="nav-dot"></span>角色档案库</a></li>
                </ul>
            </li>
        </ul>
        <div class="sidebar-footer">v 0.1.0 · 星历</div>

        <div class="theme-toggle" onclick="toggleTheme()" title="切换亮色 / 暗色主题">
            <span class="tt-icon">🌙</span>
            <span class="tt-text">暗色</span>
        </div>
    </aside>

    <!-- ========== 主区域 ========== -->
    <main class="main">
        <div class="topbar">
            <div class="breadcrumb">
                工作台 <span class="separator">❖</span> 功能模块 <span class="separator">❖</span> <span class="current">日历</span>
            </div>
            <div class="topbar-status">
                <span class="status-dot"></span>
                <span>系统正常</span>
                <span style="color:var(--gold-dim);">|</span>
                <span>星陨 2000 a.s.</span>
                <span class="data-tools"></span>
            </div>
        </div>

        <div class="page">
            <div class="header">
                <h1>星历</h1>
                <div class="sub">尤克特拉日历 · 星陨纪年</div>
            </div>

            <div class="cal-nav">
                <button class="btn btn-sm" onclick="prevMonth()">‹ 上月</button>
                <button class="btn btn-sm" onclick="nextMonth()">下月 ›</button>
                <div class="cn-title">
                    <span id="calMonthTitle">1月</span>
                    <span class="cn-year">星陨 <input class="year-input" id="yearInput" type="number" min="0" value="2000" onchange="jumpToYear()"> 年</span>
                </div>
                <div class="spacer"></div>
                <button class="btn btn-sm" onclick="goToday()">回到今天</button>
            </div>

            <div class="cal-layout">
                <div class="cal-card">
                    <div class="week-row">
                        <span class="week-day">一</span>
                        <span class="week-day">二</span>
                        <span class="week-day">三</span>
                        <span class="week-day">四</span>
                        <span class="week-day">五</span>
                        <span class="week-day">六</span>
                        <span class="week-day">日</span>
                    </div>
                    <div class="day-grid" id="dayGrid"></div>
                </div>

                <div class="event-card">
                    <div class="ec-title"><div class="diamond"></div><span id="eventTitle">本月事件</span></div>
                    <div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">
                        <button class="btn btn-sm" onclick="addEvent()">＋ 添加事件</button>
                    </div>
                    <div class="event-list" id="eventList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加事件弹窗 -->
    <div class="modal-overlay" id="eventModal" onclick="if(event.target===this)closeEventModal()">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-title">添加事件</div>
                <button class="modal-close" onclick="closeEventModal()">✕</button>
            </div>
            <label>类型</label>
            <select id="eventType">
                <option value="custom">自定义</option>
                <option value="festival">节日</option>
                <option value="birthday">生日</option>
            </select>
            <label>事件名</label>
            <input id="eventName" placeholder="事件名称…">
            <label>描述</label>
            <textarea id="eventDesc" rows="3" placeholder="事件描述…"></textarea>
            <div class="modal-btns">
                <button class="btn btn-sm" onclick="closeEventModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveEvent()">保存</button>
            </div>
        </div>
    </div>

<script>
// ========== 侧边栏分组展开/收起 ==========
function toggleNav(event, el) {
    if (event) event.preventDefault();
    el.classList.toggle('open');
    const sub = el.nextElementSibling;
    if (sub) sub.classList.toggle('open');
}

// ========== 侧边栏折叠 ==========
function toggleSidebar() {
    const sb = document.querySelector('.sidebar');
    const collapsed = sb.classList.toggle('collapsed');
    const btn = document.querySelector('.sb-toggle');
    if (btn) btn.textContent = collapsed ? '❯' : '❮';
    try { localStorage.setItem('smq_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
}
(function initSidebar() {
    const sb = document.querySelector('.sidebar');
    const btn = document.querySelector('.sb-toggle');
    if (!sb || !btn) return;
    try {
        if (localStorage.getItem('smq_sidebar_collapsed') === '1') {
            sb.classList.add('collapsed');
            btn.textContent = '❯';
        }
    } catch (e) {}
})();

// ========== 主题切换（暗色 / 亮色） ==========
function applyTheme(light) {
    document.body.classList.toggle('light', light);
    document.querySelectorAll('.theme-toggle, .mc-theme').forEach(btn => {
        const icon = btn.querySelector('.tt-icon');
        const text = btn.querySelector('.tt-text');
        if (icon) icon.textContent = light ? '☀' : '🌙';
        if (text) text.textContent = light ? '亮色' : '暗色';
    });
}
function toggleTheme() {
    const light = !document.body.classList.contains('light');
    applyTheme(light);
    try { localStorage.setItem('smq_theme', light ? 'light' : 'dark'); } catch (e) {}
}
(function initTheme() {
    try {
        if (localStorage.getItem('smq_theme') === 'light') applyTheme(true);
    } catch (e) {}
})();

// ========== 数据 ==========
const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];

// 固定节日（星陨纪年）
const festivalEvents = [
    { id: 'f-newyear', month: 0, day: 1, name: '星陨新年', desc: '星陨纪年的元旦，纪念陨石坠落后的新生。', type: 'festival', source: 'fixed' },
    { id: 'f-triumph', month: 6, day: 25, name: '凯旋日', desc: '纪念暮色战争结束的大陆最重要节日：三天庆典 + 十天假期，首日大型传送阵免费（法协承担）、次日小型免费（联盟承担）、第三夜烟火会闭幕。', type: 'festival', source: 'fixed' }
];

let customEvents = [];   // 用户自定义（持久化到 forum/日历.data.json）
let charBirthdays = [];  // 由角色档案库生日联动生成

const realToday = new Date();
const realMonth = realToday.getMonth();
const realDay = realToday.getDate();

let currentYear = 2000;
let currentMonth = realMonth;
let selectedDate = { month: realMonth, day: realDay };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 解析角色生日 "M.D" → {month(0-11), day}；id 带 b- 前缀，charId 指向角色档案库
function parseBirthday(c) {
    if (!c.birthday || c.birthday === '—') return null;
    const m = String(c.birthday).match(/^(\d{1,2})\.(\d{1,2})$/);
    if (!m) return null;
    const month = parseInt(m[1], 10) - 1;
    const day = parseInt(m[2], 10);
    if (month < 0 || month > 11 || day < 1 || day > 31) return null;
    return { id: 'b-' + c.id, charId: c.id, month, day, name: c.name + ' 生日', desc: (c.identity && c.identity !== '—') ? c.identity : '', type: 'birthday', source: 'fixed' };
}

async function load() {
    try {
        const json = await fetch('../../forum/日历.data.json').then(r => r.json());
        customEvents = (json && json.custom && json.custom.length) ? json.custom : [];
    } catch { customEvents = []; }
    // 无 Spherse 环境：应用浏览器本地编辑的数据
    try { const local = SMQ.getLocal('forum/日历.data.json', 'custom'); if (local && local.length) customEvents = local; } catch (e) {}
    try {
        const chars = await fetch('../../forum/角色档案库.data.json').then(r => r.json());
        charBirthdays = (chars.chars || []).map(parseBirthday).filter(Boolean);
    } catch { charBirthdays = []; }
    renderCalendar();
}

function getAllEvents() {
    return [...festivalEvents, ...charBirthdays, ...customEvents];
}

function getEventsForDate(month, day) {
    return getAllEvents().filter(e => e.month === month && e.day === day);
}

function getEventsForMonth(month) {
    return getAllEvents().filter(e => e.month === month).sort((a, b) => a.day - b.day);
}

function isToday(month, day) {
    return currentYear === 2000 && month === realMonth && day === realDay;
}

// ========== 渲染 ==========
function renderCalendar() {
    document.getElementById('calMonthTitle').textContent = months[currentMonth];
    document.getElementById('yearInput').value = currentYear;

    const days = monthDays[currentMonth];
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const firstDayMon = (firstDay + 6) % 7;

    let html = '';
    for (let i = 0; i < firstDayMon; i++) html += '<div class="day-cell empty"></div>';
    for (let d = 1; d <= days; d++) {
        const evts = getEventsForDate(currentMonth, d);
        const isFestival = evts.some(e => e.type === 'festival');
        const isTodayCell = isToday(currentMonth, d);
        const isSelected = selectedDate && selectedDate.month === currentMonth && selectedDate.day === d;
        html += `<div class="day-cell ${isFestival ? 'festival' : ''} ${evts.length && !isFestival ? 'has-event' : ''} ${isTodayCell ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate(${d})" title="${evts.map(e => e.name).join(' / ')}">${d}</div>`;
    }
    document.getElementById('dayGrid').innerHTML = html;

    if (selectedDate && selectedDate.month === currentMonth) renderDateEvents(selectedDate.day);
    else renderMonthEvents();
}

function selectDate(day) {
    selectedDate = { month: currentMonth, day };
    renderCalendar();
}

function renderMonthEvents() {
    const evts = getEventsForMonth(currentMonth);
    document.getElementById('eventTitle').textContent = `${months[currentMonth]} · 本月事件`;
    renderEventList(evts);
}

function renderDateEvents(day) {
    const evts = getEventsForDate(currentMonth, day);
    document.getElementById('eventTitle').textContent = `${months[currentMonth]}${day}日 · 事件`;
    renderEventList(evts);
}

// ========== 角色跳转（openFile 用项目根相对路径，经 sessionStorage 传递角色 id） ==========
function openChar(id) {
    try { sessionStorage.setItem('smq_pending_char', id); } catch (e) {}
    if (window.spherse && spherse.openFile) spherse.openFile('工作台/设定资料/角色档案库.html');
    else if (window.location) window.location.href = '../设定资料/角色档案库.html';
}

function renderEventList(evts) {
    const typeClass = e => e.type === 'festival' ? 'festival-event' : e.type === 'birthday' ? 'birthday-event' : 'custom-event';
    const clickAttr = e => e.type === 'birthday' && e.charId ? `onclick="openChar('${e.charId}')"` : '';
    document.getElementById('eventList').innerHTML = evts.length ? evts.map(e => `
        <div class="event-item ${typeClass(e)}" ${clickAttr(e)} ${e.type === 'birthday' ? 'title="点击查看角色档案"' : ''}>
            <div class="ei-date">${months[e.month]}${e.day}日</div>
            <div class="ei-name">${esc(e.name)}${e.source === 'fixed' ? '<span class="ei-fixed">固定</span>' : ''}</div>
            ${e.desc ? `<div class="ei-desc">${esc(e.desc)}</div>` : ''}
            ${e.source !== 'fixed' ? `<button class="ei-del" onclick="deleteEvent('${e.id}')" title="删除">✕</button>` : ''}
        </div>`).join('') : '<div class="empty-hint">这一天没有特殊事件</div>';
}

// ========== 翻页 ==========
function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }
function jumpToYear() {
    const y = parseInt(document.getElementById('yearInput').value, 10);
    if (!isNaN(y) && y >= 0) { currentYear = y; renderCalendar(); }
}
function goToday() {
    currentYear = 2000;
    currentMonth = realMonth;
    selectedDate = { month: realMonth, day: realDay };
    renderCalendar();
}

// ========== 事件编辑 ==========
function addEvent() {
    document.getElementById('eventType').value = 'custom';
    document.getElementById('eventName').value = '';
    document.getElementById('eventDesc').value = '';
    document.getElementById('eventModal').classList.add('open');
}
function closeEventModal() { document.getElementById('eventModal').classList.remove('open'); }

function saveEvent() {
    const type = document.getElementById('eventType').value;
    const name = document.getElementById('eventName').value.trim();
    if (!name) return;
    const desc = document.getElementById('eventDesc').value.trim();
    const month = selectedDate ? selectedDate.month : currentMonth;
    const day = selectedDate ? selectedDate.day : 1;
    customEvents.push({ id: 'e' + Date.now(), month, day, name, desc: desc || '—', type, source: 'custom' });
    closeEventModal();
    saveCustom();
}

function deleteEvent(id) {
    customEvents = customEvents.filter(e => e.id !== id);
    saveCustom();
}

async function saveCustom() {
    try {
        const res = await SMQ.save('forum/日历.data.json', 'custom', customEvents);
        renderCalendar();
        if (res.mode === 'local') SMQ.toast('已保存到浏览器本地（可用顶栏「导出数据」同步到电脑）');
    } catch (e) { renderCalendar(); }
}

// ========== 数据更新监听 ==========
if (window.spherse && spherse.events) {
    spherse.events.on('file:update', { path: '../../forum/日历.data.json' }, load);
    spherse.events.on('file:update', { path: '../../forum/角色档案库.data.json' }, load);
}

// ========== 启动 ==========
load();
</script>
</body>
</html>
