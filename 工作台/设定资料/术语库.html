<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>术语库 · 沙漠之歌工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1116;
            --bg-elevated: #14171e;
            --surface: #1a1e27;
            --surface-hover: #20242f;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --red: #9e3b34;
            --text-primary: #ede4d4;
            --text-secondary: #a8a091;
            --text-faint: #6f6a5e;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 30% 110%, rgba(201,169,106,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% -10%, rgba(63,124,156,0.05) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(201,169,106,0.01) 7px, rgba(201,169,106,0.01) 8px);
            pointer-events: none; z-index: 0;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 210px;
            min-height: 100vh;
            background: rgba(20, 23, 30, 0.97);
            border-right: 2px solid transparent;
            border-image: linear-gradient(180deg, transparent 0%, rgba(201,169,106,0.5) 20%, rgba(201,169,106,0.5) 80%, transparent 100%) 1;
            position: sticky;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            backdrop-filter: blur(20px);
        }

        .sidebar-brand {
            text-align: center;
            padding: 24px 18px 18px;
            position: relative;
            margin-bottom: 6px;
        }

        .sidebar-brand::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent);
        }

        .sidebar-brand h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.08em;
            text-shadow: 0 0 30px rgba(201,169,106,0.4);
        }

        .sidebar-brand span {
            font-family: var(--font-body);
            font-size: 9px;
            color: var(--gold-dim);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            display: block;
            margin-top: 5px;
        }

        .sidebar-section {
            font-family: var(--font-body);
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            padding: 16px 22px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-section::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(201,169,106,0.4), transparent);
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
        }

        .sidebar-nav li { margin: 1px 0; }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 22px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 400;
            text-decoration: none;
            letter-spacing: 0.04em;
            border-left: 2px solid transparent;
            transition: var(--transition);
        }

        .sidebar-nav a:hover {
            color: var(--text-primary);
            background: rgba(201,169,106,0.04);
        }

        .sidebar-nav a.active {
            color: var(--gold-bright);
            border-left-color: var(--gold);
            background: rgba(201,169,106,0.06);
        }

        .sidebar-nav .nav-num {
            font-family: var(--font-display);
            font-size: 11px;
            color: var(--gold-dim);
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* 侧边栏分组与子项 */
        .sidebar-nav a.nav-toggle {
            cursor: pointer;
            user-select: none;
        }

        .sidebar-nav a.nav-toggle.open { color: var(--gold-mid); }

        .sidebar-nav .nav-arrow {
            margin-left: auto;
            font-size: 9px;
            color: var(--gold-dim);
            transition: transform var(--transition);
            flex-shrink: 0;
        }

        .sidebar-nav a.nav-toggle.open .nav-arrow { transform: rotate(90deg); }

        .nav-sub {
            list-style: none;
            padding: 0;
            display: none;
        }

        .nav-sub.open { display: block; }

        .nav-sub a {
            padding: 7px 22px 7px 46px;
            font-size: 12px;
            font-weight: 300;
            color: var(--text-faint);
            letter-spacing: 0.05em;
        }

        .nav-sub a:hover {
            color: var(--text-primary);
            background: rgba(201,169,106,0.04);
        }

        .nav-sub a.active {
            color: var(--gold-bright);
            border-left-color: var(--gold);
            background: rgba(201,169,106,0.06);
        }

        .nav-sub .nav-dot {
            width: 4px; height: 4px;
            background: var(--gold-dim);
            transform: rotate(45deg);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .nav-sub a.active .nav-dot {
            background: var(--gold);
            box-shadow: 0 0 6px rgba(201,169,106,0.7);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 22px 18px;
            font-size: 10px;
            color: var(--text-faint);
            letter-spacing: 0.15em;
            text-align: center;
            border-top: 1px solid rgba(201,169,106,0.2);
            position: relative;
        }

        .sidebar-footer::before {
            content: '❖';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-dim);
            font-size: 9px;
            background: var(--bg-elevated);
            padding: 0 8px;
        }

        /* ========== 主区域 ========== */
        .main {
            flex: 1;
            position: relative;
            z-index: 5;
            padding: 28px 36px 50px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 22px;
            position: relative;
        }

        .topbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                rgba(201,169,106,0.9) 0%,
                rgba(201,169,106,0.5) 20%,
                rgba(201,169,106,0.15) 50%,
                rgba(201,169,106,0.5) 80%,
                rgba(201,169,106,0.9) 100%);
        }

        .topbar::before {
            content: '❖';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            font-size: 11px;
            text-shadow: 0 0 15px rgba(201,169,106,0.8);
            background: var(--bg);
            padding: 0 10px;
            z-index: 2;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-faint);
            letter-spacing: 0.08em;
        }

        .breadcrumb .separator { color: var(--gold-dim); font-size: 9px; }
        .breadcrumb .current { color: var(--gold); }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.1em;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px rgba(201,169,106,0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(201,169,106,0.8); }
            50% { opacity: 0.4; box-shadow: 0 0 4px rgba(201,169,106,0.3); }
        }

        .page { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 22px; position: relative; padding-bottom: 16px; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.4); }
        .header .sub { font-size: 11px; color: var(--text-faint); letter-spacing: 0.25em; text-transform: uppercase; margin-top: 4px; }

        /* ========== 通用 ========== */
        .card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--gold); margin-bottom: 6px; }
        .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; font-weight: 300; }
        .empty { color: var(--text-faint); text-align: center; padding: 24px; font-size: 13px; letter-spacing: 0.05em; }

        .btn { padding: 8px 14px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: var(--radius); color: var(--gold); font-family: var(--font-body); font-size: 12px; cursor: pointer; letter-spacing: 0.06em; transition: var(--transition); white-space: nowrap; }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); box-shadow: 0 0 15px rgba(201,169,106,0.15); }
        .btn-primary { background: rgba(201,169,106,0.12); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }
        .btn-danger { border-color: rgba(158,59,52,0.6); color: #c46b63; }
        .btn-danger:hover { background: rgba(158,59,52,0.1); box-shadow: 0 0 15px rgba(158,59,52,0.2); }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        /* 搜索与分类 */
        .search-row { display: flex; align-items: center; gap: 12px; }
        .search-input { flex: 1; padding: 10px 16px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; transition: var(--transition); }
        .search-input:focus { border-color: rgba(201,169,106,0.6); box-shadow: 0 0 15px rgba(201,169,106,0.1); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip {
            padding: 5px 12px;
            font-size: 11px;
            border: 1px solid rgba(201,169,106,0.3);
            border-radius: 999px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.04em;
        }
        .chip:hover { border-color: rgba(201,169,106,0.6); color: var(--gold); }
        .chip.on { background: rgba(201,169,106,0.15); border-color: rgba(201,169,106,0.7); color: var(--gold-bright); }

        .toolbar-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

        /* 术语卡片网格 */
        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }
        .term-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.05);
            outline-offset: 3px;
            border-radius: var(--radius);
            padding: 14px 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .term-card:hover { background: var(--surface-hover); border-color: rgba(201,169,106,0.45); }
        .term-card.open { background: var(--surface-hover); border-color: rgba(201,169,106,0.55); }
        .term-card .term-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .term-card .term-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--gold-bright); letter-spacing: 0.02em; }
        .term-card .term-cat { font-size: 9px; color: var(--text-faint); border: 1px solid rgba(201,169,106,0.25); border-radius: 2px; padding: 1px 6px; letter-spacing: 0.1em; }
        .term-card .term-ref { margin-left: auto; font-size: 10px; color: var(--gold-dim); letter-spacing: 0.05em; font-family: var(--font-display); }
        .term-card .term-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.65; font-weight: 300; margin-top: 8px; }
        .term-card .term-body { display: none; margin-top: 6px; }
        .term-card.open .term-body { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .term-card .term-hint { font-size: 10px; color: var(--text-faint); margin-top: 10px; letter-spacing: 0.1em; }

        /* 表格 */
        .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
        .tbl th { text-align: left; padding: 7px 10px; color: var(--gold-mid); border-bottom: 1px solid rgba(201,169,106,0.3); font-weight: 600; letter-spacing: 0.08em; font-size: 10px; text-transform: uppercase; }
        .tbl td { padding: 7px 10px; border-bottom: 1px solid rgba(201,169,106,0.08); color: var(--text-secondary); vertical-align: top; line-height: 1.55; }
        .tbl tr:last-child td { border-bottom: none; }
        .tbl td:first-child { color: var(--text-primary); font-weight: 500; white-space: nowrap; }

        /* 删除模式 */
        .delbar { display: none; position: sticky; bottom: 16px; background: rgba(18,16,13,0.95); border: 1px solid rgba(158,59,52,0.6); border-radius: var(--radius); padding: 10px 16px; justify-content: space-between; align-items: center; gap: 12px; z-index: 20; backdrop-filter: blur(10px); margin-top: 14px; }
        .delbar .cnt { font-size: 13px; color: var(--text-primary); }
        .delbar .cnt b { color: #c46b63; }
        .sel { width: 16px; height: 16px; cursor: pointer; margin-right: 8px; vertical-align: middle; }

        /* 分页 */
        .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 16px; font-size: 11px; color: var(--text-faint); flex-wrap: wrap; }

        /* 编辑弹窗 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 20px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px; padding: 20px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-head { margin-bottom: 14px; }
        .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-faint); font-size: 16px; cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal label { display: block; font-size: 11px; color: var(--gold-mid); letter-spacing: 0.1em; margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 10px; transition: var(--transition); }
        .modal input:focus, .modal textarea:focus { border-color: rgba(201,169,106,0.6); }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { padding: 20px 16px; }
            .topbar-status { display: none; }
            .header h1 { font-size: 24px; }
            .term-grid { grid-template-columns: 1fr; }
        }
        /* ========== 侧边栏折叠 ========== */
        .sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { width: 56px; }
        .sidebar.collapsed .sidebar-brand h1,
        .sidebar.collapsed .sidebar-brand span,
        .sidebar.collapsed .sidebar-section,
        .sidebar.collapsed .sidebar-nav,
        .sidebar.collapsed .sidebar-footer { display: none; }
        .sidebar.collapsed .sidebar-brand { padding: 24px 0 18px; }
        .sidebar.collapsed .sidebar-brand::before {
            content: '沙';
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-bright);
            display: block;
            text-align: center;
            text-shadow: 0 0 20px rgba(201,169,106,0.4);
        }
        .sb-toggle {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid rgba(201,169,106,0.35);
            color: var(--gold-mid);
            font-size: 9px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            font-family: var(--font-body);
            z-index: 2;
        }
        .sb-toggle:hover { color: var(--gold-bright); border-color: var(--gold); background: rgba(201,169,106,0.1); }
        .sidebar.collapsed .sb-toggle { right: 17px; }
        .sidebar.collapsed .sb-toggle:hover { background: rgba(201,169,106,0.15); }

        /* ========== 侧边栏收起：按钮 + 竖向标题 ========== */
        .sb-brand-v {
            display: none;
            writing-mode: vertical-rl;
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.4em;
            line-height: 1.4;
            color: var(--gold-bright);
            text-shadow: 0 0 16px rgba(201,169,106,0.35);
        }
        .sidebar.collapsed .sb-brand-v { display: block; order: 1; }
        .sidebar.collapsed .sidebar-brand::before { content: none; }
        .sidebar.collapsed .sidebar-brand {
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .sidebar.collapsed .sb-toggle { position: static; transform: none; order: 0; }
        .sidebar-brand span {
            font-size: 7px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        /* ========== 亮色主题（白 + 宝蓝，参考 亮色工作台.html） ========== */
        body.light {
            --bg: #f5f8fc;
            --bg-elevated: #ffffff;
            --surface: #ffffff;
            --surface-hover: #f0f4fa;
            --gold: #1e40af;
            --gold-bright: #2563eb;
            --gold-mid: #3b82f6;
            --gold-dim: #93b4f5;
            --red: #c0392b;
            --purple: #5a6fa8;
            --blue: #2563eb;
            --text-primary: #1a2538;
            --text-secondary: #4a5870;
            --text-faint: #8a95a8;
            --line: rgba(30, 64, 175, 0.18);
        }
        body.light {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(30, 64, 175, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 50% 110%, rgba(37, 99, 235, 0.04) 0%, transparent 40%);
        }
        body.light::before {
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(30, 64, 175, 0.015) 7px, rgba(30, 64, 175, 0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(30, 64, 175, 0.01) 7px, rgba(30, 64, 175, 0.01) 8px);
        }
        .theme-toggle {
            margin: 12px 16px 6px;
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            flex-shrink: 0;
            background: var(--surface);
        }
        .theme-toggle:hover { background: var(--surface-hover); color: var(--gold); border-color: var(--gold); }
        .theme-toggle .tt-icon { font-size: 13px; }
        .theme-toggle .tt-text { letter-spacing: 0.1em; }
        .sidebar.collapsed .theme-toggle { display: none; }
        .mc-theme {
            position: absolute;
            top: 12px; right: 12px;
            width: 26px; height: 26px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--surface-hover);
            color: var(--gold-mid);
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            z-index: 3;
        }
        .mc-theme {
            position: static;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }

function toggleNav(event, el) {
    if (event) event.preventDefault();
    el.classList.toggle('open');
    const sub = el.nextElementSibling;
    if (sub) sub.classList.toggle('open');
}

// ========== 侧边栏折叠 ==========
function toggleSidebar() {
    const sb = document.querySelector('.sidebar');
    const collapsed = sb.classList.toggle('collapsed');
    const btn = document.querySelector('.sb-toggle');
    if (btn) btn.textContent = collapsed ? '❯' : '❮';
    try { localStorage.setItem('smq_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
}
(function initSidebar() {
    const sb = document.querySelector('.sidebar');
    const btn = document.querySelector('.sb-toggle');
    if (!sb || !btn) return;
    try {
        if (localStorage.getItem('smq_sidebar_collapsed') === '1') {
            sb.classList.add('collapsed');
            btn.textContent = '❯';
        }
    } catch (e) {}
})();

// ========== 主题切换（暗色 / 亮色） ==========
function applyTheme(light) {
    document.body.classList.toggle('light', light);
    document.querySelectorAll('.theme-toggle, .mc-theme').forEach(btn => {
        const icon = btn.querySelector('.tt-icon');
        const text = btn.querySelector('.tt-text');
        if (icon) icon.textContent = light ? '☀' : '🌙';
        if (text) text.textContent = light ? '亮色' : '暗色';
    });
}
function toggleTheme() {
    const light = !document.body.classList.contains('light');
    applyTheme(light);
    try { localStorage.setItem('smq_theme', light ? 'light' : 'dark'); } catch (e) {}
}
(function initTheme() {
    try {
        if (localStorage.getItem('smq_theme') === 'light') applyTheme(true);

})();

        { "c1": "生命长河", "c2": "神殿深处流出的空流浓度极高液体，传说能治愈一切", "c3": "无数人为寻找它丧命" },
        { "c1": "虚无之庭", "c2": "创世神开辟的独立意识空间；安缇娜与艾尔亚沉眠于此，安缇娜在此对伊芙试炼", "c3": "物理入口在神殿内部（L1）" }
    ] },
    { "term": "始源岛", "cat": "地理与场所", "desc": "即洛丽玛丝岛，位于大陆西南近海，人类最初的居住地。现为\"禁忌之地\"，由法协/三国联盟/教会轮流看守；梅赫尔的入口设于岛内某处遗迹。", "ref": "GEO-06" },
    { "term": "《沙漠之歌》", "cat": "文献", "desc": "又称《沙漠的诗歌》，记录暮色战争及之前的故事，部分章节以诗歌形式描写。较完整的一本藏于希尼尔城皇家图书院。", "ref": "BAS-10" },
    { "term": "创世神教（组织体系）", "cat": "组织与信仰", "desc": "以信仰创世神洛丽玛丝为核心的精神权力机构，教皇查理·加百列为最高领袖。由教皇、督查司（\"教皇之眼\"）、玫瑰十字会（\"花\"）、圣殿骑士团（\"叶\"）、雇佣兵团（\"枝\"）五部分组成，另有奥比斯直辖特区。", "ref": "ORG-02~04 / NAT-05", "table": [
        { "c1": "花·玫瑰十字会", "c2": "传教与基层教区管理", "c3": "总部白塔" },
        { "c1": "叶·圣殿骑士团", "c2": "武装护卫与治安；团长撒迦利亚，下设十二席", "c3": "总部奥比斯北部" },
        { "c1": "枝·雇佣兵团", "c2": "灰色事务；团长泰伦", "c3": "总部利夫兹" },
        { "c1": "督查司", "c2": "监察与情报；胡音、慕灵", "c3": "教皇直属" }
    ] },
    { "term": "魔法师协会", "cat": "组织与信仰", "desc": "以\"研究与监管魔法技术\"为名义的独立组织，实际掌握晶体、传送阵、魔法评级等核心体系。会长安东尼奥（第二任），总部在瑞蒂安境内，各国设有分会；皇家级 6 人（前三位与后三位存在实力分水岭）。", "ref": "ORG-05" },
    { "term": "三国联盟", "cat": "组织与信仰", "desc": "由瑞蒂安、利夫兹、幻沙帝国组成，星陨 1501 年以维持大陆和平为名义成立；无常设机构与武力，本质是条约框架，与魔法师协会合作。", "ref": "ORG-01" },
    { "term": "密特拉（信仰）", "cat": "组织与信仰", "desc": "相信\"救赎之地\"存在的非正统信仰组织，暮色战争期间自发形成；教会定性为\"无害但愚昧的边缘异端\"。", "ref": "ORG-07 / ORG-08", "table": [
        { "c1": "守夜人", "c2": "被选中的神眷，在梦境接收\"咏梦者\"（耶梦加得）的低语", "c3": "守护并传递信仰" },
        { "c1": "守护者", "c2": "受\"静默者\"（尼德霍格）赐福，为受迫害信徒提供武力庇护", "c3": "" }
    ] },
    { "term": "梅赫尔", "cat": "组织与信仰", "desc": "异空间小岛，由米迦勒、尼德霍格、耶梦加得三位神共同统治；大陆人不知道它的存在（密特拉以\"救赎之地\"间接知晓）。属 L2 隐秘。", "ref": "SEC-02" },
    { "term": "历史战争（白雾 / 暮色）", "cat": "历史与纪年", "desc": "星陨 270 年白雾战争（艾尔亚建立利夫兹，结束第一王国时代）；星陨 1350–1500 年暮色战争（幻沙帝国崛起，三国百年战火，以凯旋日和平协约终结）。", "ref": "HIS-03 / HIS-04", "table": [
        { "c1": "白雾战争", "c2": "艾尔亚·利夫兹发动独立战争", "c3": "星陨 270 年" },
        { "c1": "暮色战争", "c2": "三国战火百年；梅赫尔暗中插手致战火重燃（L2）", "c3": "星陨 1350–1500" }
    ] }
];

const $ = s => document.querySelector(s);
let terms = [];
let catFilter = "";
let delMode = false;
let delSel = new Set();
let page = 0;
const PAGE_SIZE = 12;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load() {
    try {
        const json = await fetch("../../forum/术语库.data.json").then(r => r.json());
        terms = (json && json.terms && json.terms.length) ? json.terms : JSON.parse(JSON.stringify(FALLBACK_TERMS));
    } catch {
        terms = JSON.parse(JSON.stringify(FALLBACK_TERMS));
    }
    // 无 Spherse 环境：应用浏览器本地编辑的数据
    try { const local = SMQ.getLocal(DATA, 'terms'); if (local && local.length) terms = local; } catch (e) {}
    delMode = false; delSel.clear();
    renderChips(); render();
}

// ========== 分类筛选 ==========
function cats() { return [...new Set(terms.map(t => t.cat))]; }

function renderChips() {
    $("#catChips").innerHTML =
        '<span class="chip' + (!catFilter ? " on" : "") + '" onclick="setCat(\'\')">全部分类</span>' +
        cats().map(c => `<span class="chip${catFilter === c ? " on" : ""}" onclick="setCat('${esc(c)}')">${esc(c)}</span>`).join("");
}

function setCat(c) { catFilter = c; page = 0; renderChips(); render(); }
function clearFilter() { catFilter = ""; $("#q").value = ""; page = 0; renderChips(); render(); }

function filtered() {
    const q = ($("#q").value || "").trim().toLowerCase();
    return terms.filter(t => {
        if (catFilter && t.cat !== catFilter) return false;
        if (q && ![t.term, t.desc, t.cat].join(" ").toLowerCase().includes(q)) return false;
        return true;
    });
}

// ========== 渲染 ==========
function render() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page >= pages) page = 0;
    const slice = list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

    $("#terms").innerHTML = slice.length ? slice.map(t => {
        const heads = t.tableHead || ["分支", "要点", "备注"];
        const keys = t.tableHead ? ["c1", "c2", "c3", "c4", "c5"].slice(0, heads.length) : ["c1", "c2", "c3"];
        const table = t.table ? `
        <table class="tbl">
            <thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
            <tbody>${t.table.map(r => `<tr>${keys.map((k, ki) => `<td>${ki === 0 ? "<b>" : ""}${esc(r[k] || "")}${ki === 0 ? "</b>" : ""}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>` : "";
        return `
        <div class="term-card" onclick="toggleTerm(this)">
            ${delMode ? `<input type="checkbox" class="sel" ${delSel.has(t.term) ? "checked" : ""} onclick="event.stopPropagation()" onchange="toggleDel('${esc(t.term)}', this.checked)">` : ""}
            <div class="term-head">
                <span class="term-name">${esc(t.term)}</span>
                <span class="term-cat">${esc(t.cat)}</span>
                ${t.ref ? `<span class="term-ref">${esc(t.ref)}</span>` : ""}
            </div>
            <p class="term-desc">${esc(t.desc)}</p>
            <div class="term-body">${table}</div>
            ${t.table ? `<div class="term-hint">${delMode ? "☑ 勾选后删除" : "点击卡片展开详情 ▾"}</div>` : ""}
        </div>`;
    }).join("") : '<div class="empty" style="grid-column:1/-1;">没有匹配的术语</div>';

    $("#pager").innerHTML = `
        <span>共 ${list.length} 条 · 第 ${page + 1} / ${pages} 页</span>
        <button class="btn btn-sm" onclick="gotoPage(${page - 1})" ${page === 0 ? "disabled" : ""}>‹ 上一页</button>
        <button class="btn btn-sm" onclick="gotoPage(${page + 1})" ${page >= pages - 1 ? "disabled" : ""}>下一页 ›</button>`;

    $("#delbar").style.display = delMode ? "flex" : "none";
    $("#btnDel").textContent = delMode ? "✕ 退出删除" : "🗑️ 删除";
    updateDelCnt();
}

function gotoPage(p) { page = p; render(); window.scrollTo({ top: 0 }); }

function toggleTerm(el) {
    if (delMode) return;
    el.classList.toggle("open");
}

// ========== 新增 / 删除 ==========
function openEditor(title, list, onSave) {
    document.getElementById("editorTitle").textContent = title;
    document.getElementById("editorFields").innerHTML = list.map(f =>
        `<label>${esc(f.label)}</label><input id="ef-${esc(f.key)}" value="${esc(f.value ?? "")}">`).join("");
    document.getElementById("editorSave").onclick = () => {
        const out = {};
        list.forEach(f => { out[f.key] = document.getElementById("ef-" + f.key).value.trim(); });
        onSave(out);
    };
    document.getElementById("editorTip").textContent = "";
    document.getElementById("editorWrap").classList.add("open");
}
function closeEditor() { document.getElementById("editorWrap").classList.remove("open"); }

function addTerm() {
    openEditor("新增术语", [
        { key: "term", label: "术语名", value: "" },
        { key: "cat", label: "分类", value: "" },
        { key: "desc", label: "解释", value: "" },
        { key: "ref", label: "条目编号（如 BAS-01）", value: "" }
    ], out => {
        if (!out.term) { document.getElementById("editorTip").textContent = "术语名不能为空"; return; }
        terms.push({ term: out.term, cat: out.cat || "未分类", desc: out.desc || "—", ref: out.ref || "" });
        saveTerms();
    });
}

function toggleDelMode() { delMode = !delMode; delSel.clear(); render(); }
function toggleDel(name, on) { on ? delSel.add(name) : delSel.delete(name); updateDelCnt(); }
function updateDelCnt() { const el = $("#delCnt"); if (el) el.textContent = delSel.size; }

async function deleteSelected() {
    if (!delSel.size) return;
    terms = terms.filter(t => !delSel.has(t.term));
    delSel.clear(); delMode = false;
    await saveTerms();
}

async function saveTerms() {
    try {
        const res = await SMQ.save(DATA, "terms", terms);
        closeEditor();
        renderChips(); render();
        if (res.mode === 'local') SMQ.toast('已保存到浏览器本地（可用顶栏「导出数据」同步到电脑）');
    } catch {
        document.getElementById("editorTip").textContent = "保存失败，请重试";
    }
}

// ========== 事件绑定与监听 ==========
$("#q").addEventListener("input", () => { page = 0; render(); });
if (window.spherse && spherse.events) {
    spherse.events.on("file:update", { path: "../../forum/术语库.data.json" }, load);
}

// ========== 启动 ==========
load();
</script>
</body>
</html>
