<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理总览 · 沙漠之歌工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12100d;
            --bg-elevated: #14171e;
            --surface: #1c1a16;
            --surface-hover: #24211b;
            --gold: #c9a96a;
            --gold-bright: #e8d5a4;
            --gold-mid: #a88955;
            --gold-dim: #6e5a3a;
            --text-primary: #ede4d4;
            --text-secondary: #b5a990;
            --text-faint: #7a7263;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', sans-serif;
            --radius: 2px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 30% 110%, rgba(201,169,106,0.08) 0%, transparent 50%);
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(201,169,106,0.015) 7px, rgba(201,169,106,0.015) 8px), repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(201,169,106,0.01) 7px, rgba(201,169,106,0.01) 8px);
            pointer-events: none; z-index: 0;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 210px;
            min-height: 100vh;
            background: rgba(20, 23, 30, 0.97);
            border-right: 2px solid transparent;
            border-image: linear-gradient(180deg, transparent 0%, rgba(201,169,106,0.5) 20%, rgba(201,169,106,0.5) 80%, transparent 100%) 1;
            position: sticky;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            backdrop-filter: blur(20px);
        }

        .sidebar-brand {
            text-align: center;
            padding: 24px 18px 18px;
            position: relative;
            margin-bottom: 6px;
        }

        .sidebar-brand::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent);
        }

        .sidebar-brand h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.08em;
            text-shadow: 0 0 30px rgba(201,169,106,0.4);
        }

        .sidebar-brand span {
            font-family: var(--font-body);
            font-size: 9px;
            color: var(--gold-dim);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            display: block;
            margin-top: 5px;
        }

        .sidebar-section {
            font-family: var(--font-body);
            font-size: 10px;
            color: var(--gold-mid);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            padding: 16px 22px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-section::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(201,169,106,0.4), transparent);
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
        }

        .sidebar-nav li { margin: 1px 0; }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 22px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 400;
            text-decoration: none;
            letter-spacing: 0.04em;
            border-left: 2px solid transparent;
            transition: var(--transition);
        }

        .sidebar-nav a:hover {
            color: var(--text-primary);
            background: rgba(201,169,106,0.04);
        }

        .sidebar-nav a.active {
            color: var(--gold-bright);
            border-left-color: var(--gold);
            background: rgba(201,169,106,0.06);
        }

        .sidebar-nav .nav-num {
            font-family: var(--font-display);
            font-size: 11px;
            color: var(--gold-dim);
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ========== 侧边栏分组与子项 ========== */
        .sidebar-nav a.nav-toggle {
            cursor: pointer;
            user-select: none;
        }

        .sidebar-nav a.nav-toggle.open { color: var(--gold-mid); }

        .sidebar-nav .nav-arrow {
            margin-left: auto;
            font-size: 9px;
            color: var(--gold-dim);
            transition: transform var(--transition);
            flex-shrink: 0;
        }

        .sidebar-nav a.nav-toggle.open .nav-arrow { transform: rotate(90deg); }

        .nav-sub {
            list-style: none;
            padding: 0;
            display: none;
        }

        .nav-sub.open { display: block; }

        .nav-sub a {
            padding: 7px 22px 7px 46px;
            font-size: 12px;
            font-weight: 300;
            color: var(--text-faint);
            letter-spacing: 0.05em;
        }

        .nav-sub a:hover {
            color: var(--text-primary);
            background: rgba(201,169,106,0.04);
        }

        .nav-sub a.active {
            color: var(--gold-bright);
            border-left-color: var(--gold);
            background: rgba(201,169,106,0.06);
        }

        .nav-sub .nav-dot {
            width: 4px; height: 4px;
            background: var(--gold-dim);
            transform: rotate(45deg);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .nav-sub a.active .nav-dot {
            background: var(--gold);
            box-shadow: 0 0 6px rgba(201,169,106,0.7);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 22px 18px;
            font-size: 10px;
            color: var(--text-faint);
            letter-spacing: 0.15em;
            text-align: center;
            border-top: 1px solid rgba(201,169,106,0.2);
            position: relative;
        }

        .sidebar-footer::before {
            content: '❖';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-dim);
            font-size: 9px;
            background: var(--bg-elevated);
            padding: 0 8px;
        }

        /* ========== 主区域 ========== */
        .main {
            flex: 1;
            position: relative;
            z-index: 5;
            padding: 28px 36px 50px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 22px;
            position: relative;
        }

        .topbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                rgba(201,169,106,0.9) 0%,
                rgba(201,169,106,0.5) 20%,
                rgba(201,169,106,0.15) 50%,
                rgba(201,169,106,0.5) 80%,
                rgba(201,169,106,0.9) 100%);
        }

        .topbar::before {
            content: '❖';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            font-size: 11px;
            text-shadow: 0 0 15px rgba(201,169,106,0.8);
            background: var(--bg);
            padding: 0 10px;
            z-index: 2;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-faint);
            letter-spacing: 0.08em;
        }

        .breadcrumb .separator { color: var(--gold-dim); font-size: 9px; }
        .breadcrumb .current { color: var(--gold); }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.1em;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px rgba(201,169,106,0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(201,169,106,0.8); }
            50% { opacity: 0.4; box-shadow: 0 0 4px rgba(201,169,106,0.3); }
        }

        .page { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; padding-bottom: 18px; margin-bottom: 24px; position: relative; }
        .header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent); }
        .header h1 { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 30px rgba(201,169,106,0.4); }
        .header .sub { font-size: 12px; color: var(--text-faint); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 4px; }

        .search-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 10px 16px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; transition: var(--transition); }
        .search-input:focus { border-color: rgba(201,169,106,0.6); box-shadow: 0 0 15px rgba(201,169,106,0.1); }
        .btn { padding: 8px 14px; background: transparent; border: 1px solid rgba(201,169,106,0.4); border-radius: var(--radius); color: var(--gold); font-family: var(--font-body); font-size: 12px; cursor: pointer; transition: var(--transition); white-space: nowrap; }
        .btn:hover { background: rgba(201,169,106,0.1); border-color: rgba(201,169,106,0.7); }

        .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 12px; color: var(--text-faint); flex-wrap: wrap; }
        .crumb .sep { color: var(--gold-dim); }
        .crumb button { background: none; border: none; color: var(--gold); cursor: pointer; font-family: var(--font-body); font-size: 12px; transition: var(--transition); padding: 0; }
        .crumb button:hover { text-decoration: underline; }
        .crumb .cur { color: var(--text-primary); font-weight: 500; }

        .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        .map-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.25);
            outline: 1px solid rgba(201,169,106,0.08);
            outline-offset: 4px;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .map-container { position: relative; }
        #mapSvg { width: 100%; height: auto; display: block; }
        .map-controls { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 8px; z-index: 5; }
        .map-btn { padding: 6px 12px; background: rgba(18,16,13,0.9); border: 1px solid rgba(201,169,106,0.45); border-radius: var(--radius); color: var(--gold); font-size: 11px; cursor: pointer; transition: var(--transition); backdrop-filter: blur(8px); }
        .map-btn:hover { background: rgba(201,169,106,0.15); }

        .detail-panel {
            background: rgba(18,16,13,0.95);
            border: 1px solid rgba(201,169,106,0.3);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-top: 12px;
            backdrop-filter: blur(10px);
        }
        .detail-panel .dp-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--gold-bright); margin-bottom: 4px; }
        .detail-panel .dp-meta { font-size: 10px; color: var(--text-faint); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
        .detail-panel .dp-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; font-weight: 300; }

        .right-panel { display: flex; flex-direction: column; gap: 15px; }
        .info-card {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.2);
            outline: 1px solid rgba(201,169,106,0.06);
            outline-offset: 4px;
            border-radius: var(--radius);
            padding: 14px 16px;
        }
        .info-card .ic-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--gold); margin-bottom: 6px; }
        .info-card .ic-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
        .tier-chip { display: inline-block; padding: 1px 6px; margin-left: 6px; font-size: 9px; letter-spacing: 0.1em; border: 1px solid rgba(158,59,52,0.5); border-radius: 2px; color: #c46b63; vertical-align: middle; }
        .bubble-wrap { display: flex; flex-wrap: wrap; gap: 12px; }
        .bubble {
            background: var(--surface);
            border: 1px solid rgba(201,169,106,0.3);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: var(--transition);
            min-width: 100px;
            flex: 1 0 auto;
            text-align: center;
        }
        .bubble:hover { background: var(--surface-hover); transform: translateY(-2px); border-color: rgba(201,169,106,0.6); }
        .bubble .b-name { font-family: var(--font-display); font-size: 15px; color: var(--text-primary); font-weight: 600; }
        .bubble .b-sub { font-size: 10px; color: var(--text-faint); margin-top: 4px; }

        .edit-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid rgba(201,169,106,0.4); border-radius: 4px;
            padding: 20px; width: 100%; max-width: 460px; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .modal h3 { font-family: var(--font-display); font-size: 18px; color: var(--gold); margin-bottom: 14px; }
        .modal label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .modal input { width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,169,106,0.25); border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; outline: none; margin-bottom: 8px; }
        .modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { padding: 20px 16px; }
            .topbar-status { display: none; }
        }
        /* ========== 侧边栏折叠 ========== */
        .sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.collapsed { width: 56px; }
        .sidebar.collapsed .sidebar-brand h1,
        .sidebar.collapsed .sidebar-brand span,
        .sidebar.collapsed .sidebar-section,
        .sidebar.collapsed .sidebar-nav,
        .sidebar.collapsed .sidebar-footer { display: none; }
        .sidebar.collapsed .sidebar-brand { padding: 24px 0 18px; }
        .sidebar.collapsed .sidebar-brand::before {
            content: '沙';
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-bright);
            display: block;
            text-align: center;
            text-shadow: 0 0 20px rgba(201,169,106,0.4);
        }
        .sb-toggle {
            position: absolute;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid rgba(201,169,106,0.35);
            color: var(--gold-mid);
            font-size: 9px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            font-family: var(--font-body);
            z-index: 2;
        }
        .sb-toggle:hover { color: var(--gold-bright); border-color: var(--gold); background: rgba(201,169,106,0.1); }
        .sidebar.collapsed .sb-toggle { right: 17px; }
        .sidebar.collapsed .sb-toggle:hover { background: rgba(201,169,106,0.15); }

        /* ========== 侧边栏收起：按钮 + 竖向标题 ========== */
        .sb-brand-v {
            display: none;
            writing-mode: vertical-rl;
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.4em;
            line-height: 1.4;
            color: var(--gold-bright);
            text-shadow: 0 0 16px rgba(201,169,106,0.35);
        }
        .sidebar.collapsed .sb-brand-v { display: block; order: 1; }
        .sidebar.collapsed .sidebar-brand::before { content: none; }
        .sidebar.collapsed .sidebar-brand {
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .sidebar.collapsed .sb-toggle { position: static; transform: none; order: 0; }
        .sidebar-brand span {
            font-size: 7px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        /* ========== 亮色主题（白 + 宝蓝，参考 亮色工作台.html） ========== */
        body.light {
            --bg: #f5f8fc;
            --bg-elevated: #ffffff;
            --surface: #ffffff;
            --surface-hover: #f0f4fa;
            --gold: #1e40af;
            --gold-bright: #2563eb;
            --gold-mid: #3b82f6;
            --gold-dim: #93b4f5;
            --red: #c0392b;
            --purple: #5a6fa8;
            --blue: #2563eb;
            --text-primary: #1a2538;
            --text-secondary: #4a5870;
            --text-faint: #8a95a8;
            --line: rgba(30, 64, 175, 0.18);
        }
        body.light {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(30, 64, 175, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 50% 110%, rgba(37, 99, 235, 0.04) 0%, transparent 40%);
        }
        body.light::before {
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(30, 64, 175, 0.015) 7px, rgba(30, 64, 175, 0.015) 8px),
                repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(30, 64, 175, 0.01) 7px, rgba(30, 64, 175, 0.01) 8px);
        }
        .theme-toggle {
            margin: 12px 16px 6px;
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            flex-shrink: 0;
            background: var(--surface);
        }
        .theme-toggle:hover { background: var(--surface-hover); color: var(--gold); border-color: var(--gold); }
        .theme-toggle .tt-icon { font-size: 13px; }
        .theme-toggle .tt-text { letter-spacing: 0.1em; }
        .sidebar.collapsed .theme-toggle { display: none; }
        .mc-theme {
            position: absolute;
            top: 12px; right: 12px;
            width: 26px; height: 26px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--surface-hover);
            color: var(--gold-mid);
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            z-index: 3;
        }
        .mc-theme {
            position: static;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }
        .mc-theme:hover { color: var(--gold); border-color: var(--gold); background: var(--surface-hover); }
        .mc-theme .tt-icon { font-size: 13px; }
        .mc-theme .tt-text { letter-spacing: 0.1em; }
        /* 亮色去金化：圆角对齐模板，容器/输入/按钮边框统一为宝蓝线条 */
        body.light { --radius: 6px; }
        body.light .card,
        body.light .frame-card,
        body.light .todo-card,
        body.light .mini-cal,
        body.light .modal,
        body.light .event-card,
        body.light .cal-card,
        body.light .char-card,
        body.light .term-card,
        body.light .bubble,
        body.light .notice,
        body.light .pt-card,
        body.light .info-card,
        body.light .map-card,
        body.light .input,
        body.light .search-input,
        body.light .year-input,
        body.light .todo-input,
        body.light .comment-input,
        body.light .feed-input,
        body.light .chat-input,
        body.light .pt-input,
        body.light .modal input,
        body.light .modal textarea,
        body.light .modal select,
        body.light .field .input,
        body.light .relcanvas { border-color: var(--line); }
        body.light .btn,
        body.light .chip,
        body.light .tag,
        body.light .tag-user,
        body.light .meta-chip,
        body.light .member-chip,
        body.light .sub-node-chip,
        body.light .tl-tag { border-color: var(--line); }
        body.light .btn:hover,
        body.light .chip:hover,
        body.light .meta-chip:hover { border-color: var(--gold); background: var(--surface-hover); }
        body.light input:focus,
        body.light textarea:focus,
        body.light select:focus { border-color: var(--gold-bright); }
        body.light .card,
        body.light .frame-card,
        body.light .todo-card,
        body.light .mini-cal,
        body.light .modal,
        body.light .char-card,
        body.light .term-card,
        body.light .bubble { box-shadow: 0 2px 12px rgba(30, 64, 175, 0.08); }

function buildIndex(nodes, parent) {
    let map = {}, par = {};
    const walk = (arr, p) => {
        (arr || []).forEach(n => {
            map[n.id] = n; par[n.id] = p;
            if (n.children) walk(n.children, n.id);
        });
    };
    walk(nodes, null);
    return { map, par };
}
function findNode(arr, id) {
    for (const n of arr) {
        if (n.id === id) return n;
        if (n.children) { const r = findNode(n.children, id); if (r) return r; }
    }
    return null;
}

// ========== 初始化地图 ==========
const fullViewBox = { x: 0, y: 0, width: 700, height: 480 };
function initMap() {
    mapSvg = document.getElementById('mapSvg');
    detailPanel = document.getElementById('detailPanel');
    infoPanel = document.getElementById('infoPanel');
}

function animateMapTo(targetBox, duration = 500) {
    const startBox = {
        x: mapSvg.viewBox.baseVal.x, y: mapSvg.viewBox.baseVal.y,
        width: mapSvg.viewBox.baseVal.width, height: mapSvg.viewBox.baseVal.height
    };
    const startTime = performance.now();
    function ease(t) { return t < 0.5 ? 4*t*t*t : (t-1)*(2*t-2)*(2*t-2)+1; }
    function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const e = ease(t);
        mapSvg.setAttribute('viewBox',
            `${startBox.x + (targetBox.x-startBox.x)*e} ${startBox.y + (targetBox.y-startBox.y)*e} ${startBox.width + (targetBox.width-startBox.width)*e} ${startBox.height + (targetBox.height-startBox.height)*e}`);
        if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// 计算某个节点的目标视角；offmap（异空间）节点允许跳出地图范围
function viewBoxFor(node) {
    const w = fullViewBox.width / node.coords.zoom;
    const h = fullViewBox.height / node.coords.zoom;
    let x = node.coords.x - w / 2;
    let y = node.coords.y - h / 2;
    if (!node.offmap) {
        x = Math.max(0, Math.min(x, fullViewBox.width - w));
        y = Math.max(0, Math.min(y, fullViewBox.height - h));
    }
    return { x, y, width: w, height: h };
}

// ========== 地图标记绘制 ==========
function drawMapMarkers(nodes) {
    document.querySelectorAll('.map-loc').forEach(g => g.remove());

    const { map } = buildIndex(geoData.overview, null);
    const current = currentId ? map[currentId] : null;
    const children = current ? (current.children || []) : geoData.overview;

    children.forEach(n => {
        if (n.coords) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'map-loc');
            g.setAttribute('data-id', n.id);
            g.innerHTML = `<circle cx="${n.coords.x}" cy="${n.coords.y}" r="6" fill="#c9a96a" stroke="#ede4d4" stroke-width="1.5" style="cursor:pointer;"/><text x="${n.coords.x}" y="${n.coords.y - 12}" fill="#ede4d4" font-size="12" text-anchor="middle" style="pointer-events:none;">${esc(n.name)}</text>`;
            mapSvg.appendChild(g);
            g.addEventListener('click', () => {
                go(n.id);
                if (n.coords) animateMapTo(viewBoxFor(n));
            });
        }
    });
}

// ========== 渲染 ==========
function render() {
    const { map, par } = buildIndex(geoData.overview, null);
    const node = currentId ? map[currentId] : null;

    // 面包屑
    let path = [];
    let p = currentId;
    while (p) { path.unshift(p); p = par[p]; }
    const crumbEl = document.getElementById('crumb');
    if (!currentId) {
        crumbEl.innerHTML = '<span class="cur">总览 · 尤克特拉</span>';
    } else {
        crumbEl.innerHTML = '<button onclick="go(null)">总览</button>' + path.map((id, i) => {
            const n = map[id];
            return '<span class="sep">›</span>' + (i < path.length - 1
                ? `<button onclick="go('${n.id}')">${esc(n.name)}</button>`
                : `<span class="cur">${esc(n.name)}</span>`);
        }).join('');
    }

    // 右侧信息面板
    const infoTitle = document.getElementById('infoTitle');
    const infoDesc = document.getElementById('infoDesc');
    if (!node) {
        infoTitle.textContent = '大陆总览';
        infoDesc.textContent = '点击气泡逐层进入：大陆 → 地形 → 国家 → 城镇。';
    } else {
        infoTitle.innerHTML = esc(node.name) + (node.tier ? `<span class="tier-chip">${esc(node.tier)}</span>` : '');
        infoDesc.textContent = node.desc || '—';
    }

    // 气泡
    const children = node ? (node.children || []) : geoData.overview;
    const bubbleWrap = document.getElementById('bubbles');
    if (!children.length) {
        bubbleWrap.innerHTML = '<div style="font-size:12px;color:var(--text-faint);padding:8px;">此处没有下一层</div>';
    } else {
        bubbleWrap.innerHTML = children.map(n => {
            const areaTxt = n.area ? '约' + n.area + '万km²' : '';
            const tierTxt = n.tier ? '分级 ' + esc(n.tier) : '';
            return `<div class="bubble" onclick="go('${n.id}')">
                <div class="b-name">${esc(n.name)}</div>
                <div class="b-sub">${[tierTxt, areaTxt].filter(Boolean).join(' · ')}</div>
            </div>`;
        }).join('');
    }

    // 地图标记
    drawMapMarkers(children);

    // 详情面板（地图点击后显示）
    if (node && node.coords) {
        document.getElementById('dpTitle').textContent = node.name;
        document.getElementById('dpMeta').textContent = '面积 ' + (node.area || '?') + ' 万km²';
        document.getElementById('dpDesc').textContent = node.desc || '—';
        detailPanel.style.display = 'block';
    } else {
        detailPanel.style.display = 'none';
    }
}

// ========== 导航 ==========
function go(id) {
    currentId = id;
    const { map } = buildIndex(geoData.overview, null);
    const node = id ? map[id] : null;
    if (node && node.coords) {
        animateMapTo(viewBoxFor(node));
    } else if (!id) {
        animateMapTo(fullViewBox);
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goUp() {
    if (!currentId) return;
    const { map, par } = buildIndex(geoData.overview, null);
    go(par[currentId] || null);
}

// ========== 搜索 ==========
function doSearch() {
    const q = ($('#q').value || '').trim().toLowerCase();
    if (!q) return;
    const { map } = buildIndex(geoData.overview, null);
    const hits = Object.values(map).filter(n => (n.name + ' ' + (n.desc || '')).toLowerCase().includes(q));
    if (hits.length) {
        go(hits[0].id);
    } else {
        alert('未找到');
    }
}
function clearSearch() { $('#q').value = ''; }
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ========== 编辑与新增 ==========
function editCurrent() {
    if (!currentId) return;
    const { map } = buildIndex(geoData.overview, null);
    const node = map[currentId];
    openEditor('编辑 · ' + node.name, node, false);
}
function addChildCurrent() {
    if (!currentId) return;
    const { map } = buildIndex(geoData.overview, null);
    const node = map[currentId];
    openEditor('在「' + node.name + '」下新增', { name: '', desc: '', area: 0, pop: 0 }, true);
}
function openEditor(title, node, isNew) {
    const wrap = $('#editorWrap');
    $('#editorTitle').textContent = title;
    $('#editorFields').innerHTML = `
        <label>名称<input id="ef_name" value="${esc(node.name)}"></label>
        <label>描述<input id="ef_desc" value="${esc(node.desc || '')}"></label>
        <label>面积（万km²）<input id="ef_area" type="number" value="${node.area || ''}"></label>
        <label>人口（万）<input id="ef_pop" type="number" value="${node.pop || ''}"></label>
        <label>X坐标<input id="ef_x" type="number" value="${node.coords ? node.coords.x : ''}"></label>
        <label>Y坐标<input id="ef_y" type="number" value="${node.coords ? node.coords.y : ''}"></label>
        <label>缩放级别<input id="ef_zoom" type="number" step="0.5" value="${node.coords ? node.coords.zoom : 3}"></label>
    `;
    wrap.classList.add('open');
    $('#editorSave').onclick = () => {
        const out = {
            name: $('#ef_name').value.trim(),
            desc: $('#ef_desc').value.trim(),
            area: parseFloat($('#ef_area').value) || 0,
            pop: parseFloat($('#ef_pop').value) || 0,
            coords: { x: parseFloat($('#ef_x').value) || 0, y: parseFloat($('#ef_y').value) || 0, zoom: parseFloat($('#ef_zoom').value) || 3 }
        };
        if (!out.name) { alert('名称不能为空'); return; }
        if (isNew) {
            node.children = node.children || [];
            node.children.push({ id: 'n' + Date.now(), ...out, children: [] });
        } else {
            Object.assign(node, out);
        }
        closeEditor();
        render();
    };
}
function closeEditor() { $('#editorWrap').classList.remove('open'); }

// ========== 启动 ==========
document.getElementById('resetMapBtn').addEventListener('click', () => go(null));
initMap();
render();
</script>
</body>
